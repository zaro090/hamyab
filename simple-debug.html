<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تست ساده Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1>📡 تست اتصال به Firebase</h1>
    <div id="status">در حال اتصال...</div>
    <div id="data"></div>

    <script>
        const config = {
            apiKey: "AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",
            authDomain: "location-tracker-e732b.firebaseapp.com",
            projectId: "location-tracker-e732b",
            storageBucket: "location-tracker-e732b.firebasestorage.app",
            messagingSenderId: "425589009128",
            appId: "1:425589009128:web:759e3b6b614434eb75775d"
        };

        firebase.initializeApp(config);
        const db = firebase.database();

        const status = document.getElementById('status');
        const dataDiv = document.getElementById('data');

        status.textContent = '⏳ در حال دریافت اطلاعات...';

        db.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                dataDiv.innerHTML = '❌ هیچ کاربری آنلاین نیست';
                status.textContent = '🟢 متصل';
                return;
            }

            let html = '✅ کاربران آنلاین:<br><br>';
            let count = 0;
            const now = Date.now();

            for (let id in data) {
                const loc = data[id];
                if (!loc.lat || !loc.lng) continue;

                const timeDiff = (now - loc.timestamp) / 1000 / 60;
                const isOnline = timeDiff < 2;

                if (isOnline) {
                    count++;
                    html += `👤 ${loc.name || 'کاربر'} - 📍 ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)} - 🕐 ${timeDiff.toFixed(1)} دقیقه پیش<br>`;
                }
            }

            html += `<br><strong>✅ مجموع: ${count} کاربر آنلاین</strong>`;
            dataDiv.innerHTML = html;
            status.textContent = '🟢 متصل به Firebase';
        }, (error) => {
            status.textContent = '❌ خطا: ' + error.message;
            dataDiv.innerHTML = '⚠️ مشکل در اتصال به Firebase';
        });
    </script>
</body>
</html>
