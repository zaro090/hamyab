<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیاب - ۱۰ ماشین</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0b1220;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 24px;
        }
        .loginCard {
            background: #1e293b;
            border-radius: 32px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
            border: 1px solid #334155;
            text-align: center;
        }
        .loginCard h1 {
            color: #f5c542;
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .loginCard p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .loginCard input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 16px;
            text-align: center;
        }
        .loginCard input:focus {
            border-color: #f5c542;
            outline: none;
        }
        .loginCard button {
            width: 100%;
            padding: 16px;
            background: #f5c542;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .controls {
            position: fixed;
            right: 12px;
            bottom: 120px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls button {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #usersPanel {
            position: fixed;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            text-align: center;
            max-height: 140px;
            overflow-y: auto;
        }
        #usersList {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
        }
        .user-chip {
            background: #1e293b;
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            border: 1px solid #334155;
            cursor: pointer;
            white-space: nowrap;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f5c542;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 999;
            display: none;
            border: 1px solid #f5c542;
        }
        .car-marker {
            background: transparent !important;
            border: 0 !important;
        }
        .car-wrap {
            width: 60px;
            height: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .car-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 3px solid #2563eb;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }
        .car-circle.me {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        .car-name {
            margin-top: 2px;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 7px;
            white-space: nowrap;
            max-width: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .share-box {
            margin-top: 12px;
            padding: 10px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .share-box input {
            width: 65%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 0.65rem;
            text-align: center;
        }
        .share-box button {
            padding: 6px 12px;
            background: #f5c542;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .online-count {
            color: #22c55e;
            font-weight: 700;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="loginCard">
            <h1>🚗 همیاب</h1>
            <p>موقعیت لحظه‌ای تا ۱۰ خودرو</p>
            <input id="nameInput" maxlength="20" placeholder="نام خود را وارد کن..." autofocus>
            <button id="joinBtn">🚀 ورود به نقشه</button>
            <div class="share-box">
                <p style="font-size:0.7rem;color:#94a3b8;margin-bottom:6px;">🔗 لینک اشتراک‌گذاری برای بقیه</p>
                <input id="shareLink" value="https://zaro090.github.io/hamyab/" readonly>
                <button onclick="copyLink()">📋 کپی</button>
                <p style="font-size:0.55rem;color:#64748b;margin-top:4px;">✅ همه با همین لینک وارد بشن</p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <button id="myLocationBtn">📍</button>
        <button id="showAllBtn">👥</button>
        <button id="zoomInBtn">＋</button>
        <button id="zoomOutBtn">－</button>
    </div>

    <div id="usersPanel">
        <div class="header-info">
            <span>🚗 خودروهای آنلاین</span>
            <span class="online-count" id="onlineCount">۰</span>
        </div>
        <div id="usersList"></div>
    </div>

    <div id="toast"></div>

    <script>
        // ===== تنظیمات JSONBin =====
        const BIN_ID = "67c8c8e8ad19ca34f877b8e8";
        const API_KEY = "$2a$10$KtE9sM9WZq7n5pQrJxWXvO.gJtXhQZvY9lM8nT4rU2iK3oP5sD6fG";

        let map, myName, myLat, myLng;
        const allUsers = {};
        const userMarkers = {};
        let watchId = null;
        let syncInterval = null;
        let isFirstLocation = true;

        // ===== نقشه =====
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        // ===== پیام =====
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 2500);
        }

        // ===== کپی لینک =====
        function copyLink() {
            const input = document.getElementById('shareLink');
            input.select();
            document.execCommand('copy');
            toast('✅ لینک کپی شد!');
        }

        // ===== رنگ =====
        function userColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 80%, 55%)`;
        }

        // ===== آیکون ماشین =====
        function carIcon(name, isMe = false) {
            const color = isMe ? '#22c55e' : userColor(name);
            return L.divIcon({
                className: 'car-marker',
                iconSize: [60, 65],
                iconAnchor: [30, 33],
                popupAnchor: [0, -30],
                html: `
                    <div class="car-wrap">
                        <div class="car-circle ${isMe ? 'me' : ''}" style="border-color:${color}">🚗</div>
                        <div class="car-name">${name}</div>
                    </div>
                `
            });
        }

        // ===== آپدیت لیست کاربران =====
        function updateUI() {
            const list = document.getElementById('usersList');
            const count = document.getElementById('onlineCount');
            const users = Object.keys(allUsers);
            count.textContent = users.length;
            list.innerHTML = users.map(u =>
                `<span class="user-chip" onclick="goToUser('${u}')">🚗 ${u}</span>`
            ).join('');
        }

        // ===== رفتن به کاربر =====
        function goToUser(name) {
            const user = allUsers[name];
            if (user && user.lat && user.lng) {
                map.setView([user.lat, user.lng], 17, { animate: true });
                toast('📍 رفتن به ' + name);
            }
        }

        // ===== آپدیت مارکرها =====
        function updateMarkers() {
            const now = Date.now();
            // حذف کاربران آفلاین (بیشتر از ۱۵ ثانیه)
            for (let name in allUsers) {
                if (now - allUsers[name].timestamp > 15000) {
                    delete allUsers[name];
                    if (userMarkers[name]) {
                        map.removeLayer(userMarkers[name]);
                        delete userMarkers[name];
                    }
                }
            }
            // افزودن/به‌روزرسانی مارکرها
            for (let name in allUsers) {
                const user = allUsers[name];
                if (!user.lat || !user.lng) continue;
                const isMe = (name === myName);
                if (!userMarkers[name]) {
                    const icon = carIcon(name, isMe);
                    const marker = L.marker([user.lat, user.lng], { icon, zIndexOffset: isMe ? 2000 : 0 }).addTo(map);
                    marker.bindPopup(`<b>${name}</b>${isMe ? ' (شما)' : ''}`);
                    userMarkers[name] = marker;
                } else {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                }
            }
            updateUI();
        }

        // ===== GPS =====
        function startGPS() {
            if (!navigator.geolocation) {
                toast('❌ GPS در دسترس نیست');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    sendLocation();
                    if (isFirstLocation) {
                        map.setView([myLat, myLng], 15, { animate: true });
                        isFirstLocation = false;
                        toast('✅ موقعیت شما ثبت شد');
                    }
                },
                err => toast('❌ خطا: ' + err.message),
                { enableHighAccuracy: true, timeout: 15000 }
            );
            watchId = navigator.geolocation.watchPosition(
                pos => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    sendLocation();
                },
                err => console.log('GPS:', err),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ===== ارسال به JSONBin =====
        function sendLocation() {
            if (!myName || myLat === undefined || myLng === undefined) return;
            allUsers[myName] = { lat: myLat, lng: myLng, timestamp: Date.now() };
            updateMarkers();
            const data = { users: allUsers, timestamp: Date.now() };
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(data)
            }).catch(err => console.log('Sync error:', err));
        }

        // ===== دریافت از JSONBin =====
        function fetchFromCloud() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                const cloudData = data.record;
                if (cloudData && cloudData.users) {
                    for (let name in cloudData.users) {
                        const user = cloudData.users[name];
                        if (user.lat && user.lng) {
                            allUsers[name] = user;
                        }
                    }
                    updateMarkers();
                }
            })
            .catch(err => console.log('Fetch error:', err));
        }

        // ===== همگام‌سازی دوره‌ای =====
        function startSync() {
            fetchFromCloud();
            syncInterval = setInterval(() => {
                fetchFromCloud();
                if (myName && myLat !== undefined && myLng !== undefined) {
                    allUsers[myName] = { lat: myLat, lng: myLng, timestamp: Date.now() };
                    updateMarkers();
                }
            }, 3000);
        }

        // ===== نمایش همه =====
        function showAll() {
            const points = [];
            for (let name in allUsers) {
                const user = allUsers[name];
                if (user.lat && user.lng) {
                    points.push([user.lat, user.lng]);
                }
            }
            if (points.length === 0) {
                toast('👥 هیچ کاربری آنلاین نیست');
                return;
            }
            if (points.length === 1) {
                map.setView(points[0], 15, { animate: true });
                return;
            }
            map.fitBounds(L.latLngBounds(points), { padding: [50, 50], maxZoom: 16, animate: true });
        }

        // ===== موقعیت من =====
        function goToMyLocation() {
            if (myLat !== undefined && myLng !== undefined) {
                map.setView([myLat, myLng], 17, { animate: true });
                toast('📍 رفتن به موقعیت شما');
            } else {
                toast('⏳ موقعیت شما هنوز ثبت نشده');
            }
        }

        // ===== ورود =====
        function joinApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { toast('❌ نام خود را وارد کن'); return; }
            if (name.length < 2) { toast('❌ نام حداقل ۲ حرف باشد'); return; }
            myName = name;
            document.getElementById('loginOverlay').style.display = 'none';
            initMap();
            startGPS();
            startSync();

            window.addEventListener('beforeunload', () => {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                if (syncInterval) clearInterval(syncInterval);
            });
        }

        // ===== رویدادها =====
        document.getElementById('joinBtn').addEventListener('click', joinApp);
        document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinApp(); });
        document.getElementById('myLocationBtn').addEventListener('click', goToMyLocation);
        document.getElementById('showAllBtn').addEventListener('click', showAll);
        document.getElementById('zoomInBtn').addEventListener('click', () => map.zoomIn());
        document.getElementById('zoomOutBtn').addEventListener('click', () => map.zoomOut());

        console.log('🚗 همیاب برای ۱۰ ماشین آماده است!');
        console.log('📌 همه با همین لینک وارد بشن: https://zaro090.github.io/hamyab/');
    </script>
</body>
</html>
