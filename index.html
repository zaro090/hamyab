<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>هم‌یاب هوشمند</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0b0b0b;
            color: #f0f0f0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
            touch-action: pan-x pan-y;
        }

        /* ===== صفحه ورود ===== */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 24px;
        }
        #login-box {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 36px 28px;
            max-width: 400px;
            width: 100%;
            border: 1.5px solid #f5c542;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.95);
            text-align: center;
        }
        #login-box h1 {
            color: #f5c542;
            font-size: 2rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        #login-box p {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        #login-box input {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1.5px solid #333;
            background: #222;
            color: #fff;
            font-size: 1.1rem;
            font-family: inherit;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.2s;
        }
        #login-box input:focus {
            border-color: #f5c542;
            outline: none;
            box-shadow: 0 0 0 4px rgba(245, 197, 66, 0.15);
            background: #1a1a1a;
        }
        #login-box button {
            width: 100%;
            padding: 18px;
            background: #f5c542;
            color: #0b0b0b;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(245, 197, 66, 0.2);
        }
        #login-box button:active {
            transform: scale(0.96);
        }

        /* ===== لیست کاربران پایین صفحه ===== */
        #user-list {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 16, 16, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 14px 20px;
            z-index: 100;
            border: 1px solid #2a2a2a;
            max-width: 94%;
            width: auto;
            text-align: center;
            font-size: 0.85rem;
            color: #ccc;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        #user-list span {
            display: inline-block;
            margin: 0 4px;
            padding: 4px 14px;
            border-radius: 30px;
            background: #2a2a2a;
            font-size: 0.8rem;
            pointer-events: auto;
        }

        /* ===== دکمه نقطه ملاقات ===== */
        .meeting-point-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #f5c542;
            color: #0b0b0b;
            border: none;
            border-radius: 60px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 700;
            z-index: 200;
            font-family: inherit;
            box-shadow: 0 4px 28px rgba(245, 197, 66, 0.35);
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            min-width: 200px;
            letter-spacing: 0.5px;
        }
        .meeting-point-btn:active {
            transform: scale(0.94);
        }

        /* ===== پیامک ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a0e;
            color: #f5c542;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            z-index: 999;
            display: none;
            border: 1px solid #f5c542;
            backdrop-filter: blur(8px);
            max-width: 92%;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        /* ===== پاپ‌آپ نقشه ===== */
        .leaflet-popup-content {
            font-family: 'Vazirmatn', sans-serif !important;
            font-size: 0.95rem !important;
            text-align: center;
            padding: 4px 0;
            min-width: 120px;
        }
        .leaflet-popup-content b {
            font-size: 1.05rem;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 16px !important;
            background: #1a1a1a !important;
            color: #f0f0f0 !important;
            border: 1px solid #333;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 480px) {
            #login-box {
                padding: 28px 18px;
            }
            #login-box h1 {
                font-size: 1.6rem;
            }
            #login-box input {
                padding: 16px;
                font-size: 1rem;
            }
            #login-box button {
                padding: 16px;
                font-size: 1rem;
            }
            #user-list {
                font-size: 0.7rem;
                padding: 10px 14px;
                bottom: 12px;
                border-radius: 16px;
            }
            .meeting-point-btn {
                bottom: 72px;
                padding: 14px 24px;
                font-size: 0.85rem;
                min-width: 160px;
            }
            .toast {
                font-size: 0.8rem;
                padding: 12px 20px;
                top: 14px;
            }
        }

        @media (min-width: 600px) {
            #login-box {
                padding: 44px 36px;
            }
            #login-box h1 {
                font-size: 2.4rem;
            }
            .meeting-point-btn {
                padding: 18px 40px;
                font-size: 1.1rem;
            }
        }

        /* ===== اسکرول مخفی ===== */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== صفحه ورود ===== -->
    <div id="login-overlay">
        <div id="login-box">
            <h1>📍 هم‌یاب</h1>
            <p>برای پیدا کردن همدیگر در سفر</p>
            <input type="text" id="usernameInput" placeholder="نام خود را وارد کن..." maxlength="20" autofocus />
            <button id="joinBtn">🚀 ورود به نقشه</button>
        </div>
    </div>

    <!-- ===== نقشه ===== -->
    <div id="map"></div>

    <!-- ===== لیست کاربران ===== -->
    <div id="user-list">
        <span style="color:#aaa;">👥 آنلاین:</span>
        <span id="onlineUsers">هیچکس</span>
    </div>

    <!-- ===== دکمه نقطه ملاقات ===== -->
    <button class="meeting-point-btn" id="meetingPointBtn">📍 نقطه ملاقات</button>

    <!-- ===== پیامک ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== Firebase ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>

    <script>
        // ===== Firebase =====
        const firebaseConfig = {
            apiKey: "AIzaSyBV_HPvDfrG7npGtDfA8wrk0XRtq4s5c4k",
            authDomain: "location-tracker-e732b.firebaseapp.com",
            projectId: "location-tracker-e732b",
            storageBucket: "location-tracker-e732b.firebasestorage.app",
            messagingSenderId: "425589009128",
            appId: "1:425589009128:web:759e3b6b614434eb75775d",
            measurementId: "G-TRV5QWJM7D"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ===== متغیرها =====
        let map;
        let userMarkers = {};
        let myUsername = '';
        let myLat = 0,
            myLng = 0;
        let watchId = null;
        let meetingMarker = null;
        let userData = {};

        // ===== نقشه =====
        function initMap() {
            map = L.map('map', {
                zoomControl: true,
                fadeAnimation: true,
                attributionControl: true
            }).setView([35.6892, 51.3890], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // بزرگ‌نمایی با دو انگشت
            map.touchZoom = true;
            map.doubleClickZoom = true;
            map.scrollWheelZoom = true;
        }

        // ===== پیام =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 2800);
        }

        // ===== مسافت =====
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ===== GPS =====
        function startTracking() {
            if (!navigator.geolocation) {
                showToast('❌ گوشی شما GPS ندارد!');
                return;
            }

            const options = {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 3000
            };

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    sendLocation();
                    showToast('✅ موقعیت شما ثبت شد');
                },
                function(err) {
                    showToast('❌ خطا: ' + err.message);
                },
                options
            );

            watchId = navigator.geolocation.watchPosition(
                function(pos) {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    sendLocation();
                },
                function(err) {
                    console.log('خطا:', err);
                },
                options
            );
        }

        // ===== ارسال =====
        function sendLocation() {
            if (!myUsername || myLat === 0 || myLng === 0) return;
            db.ref('locations/' + myUsername).set({
                lat: myLat,
                lng: myLng,
                name: myUsername,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // ===== دریافت =====
        function listenLocations() {
            db.ref('locations').on('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    for (let key in userMarkers) map.removeLayer(userMarkers[key]);
                    userMarkers = {};
                    userData = {};
                    document.getElementById('onlineUsers').textContent = 'هیچکس';
                    return;
                }

                userData = data;
                const now = Date.now();
                const onlineList = [];
                const newMarkers = {};

                for (let username in data) {
                    const loc = data[username];
                    if (!loc.lat || !loc.lng) continue;

                    const timeDiff = (now - loc.timestamp) / 1000 / 60;
                    const isOnline = timeDiff < 5;
                    if (isOnline) onlineList.push(username);

                    const distance = (myLat && myLng) ? calculateDistance(myLat, myLng, loc.lat, loc.lng) : 0;

                    let popup = `<b>${username}</b>`;
                    if (username === myUsername) popup += ` (شما)`;
                    popup += `<br>📍 ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`;
                    if (distance > 0) popup += `<br>📏 ${distance.toFixed(1)} کیلومتر`;
                    popup += `<br>${isOnline ? '🟢 آنلاین' : '⏰ ' + Math.round(timeDiff) + ' دقیقه پیش'}`;

                    if (!userMarkers[username]) {
                        const color = username === myUsername ? '#4a9eff' : stringToColor(username);
                        const marker = L.circleMarker([loc.lat, loc.lng], {
                            radius: username === myUsername ? 18 : 14,
                            fillColor: color,
                            color: '#fff',
                            weight: 2.5,
                            opacity: 1,
                            fillOpacity: 0.85
                        }).addTo(map);
                        marker.bindPopup(popup);
                        userMarkers[username] = marker;
                    } else {
                        userMarkers[username].setLatLng([loc.lat, loc.lng]);
                        userMarkers[username].setPopupContent(popup);
                        if (username === myUsername) {
                            userMarkers[username].setRadius(18);
                            userMarkers[username].setStyle({ fillColor: '#4a9eff' });
                        }
                    }
                    newMarkers[username] = userMarkers[username];
                }

                for (let username in userMarkers) {
                    if (!newMarkers[username]) {
                        map.removeLayer(userMarkers[username]);
                        delete userMarkers[username];
                    }
                }

                document.getElementById('onlineUsers').textContent =
                    onlineList.length > 0 ? onlineList.join(' - ') : 'هیچکس';

                if (myUsername && data[myUsername]) {
                    map.setView([data[myUsername].lat, data[myUsername].lng], 15);
                }
            });
        }

        // ===== رنگ =====
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 80%, 55%)`;
        }

        // ===== نقطه ملاقات =====
        function setMeetingPoint() {
            if (!map) return;
            showToast('📍 روی نقشه کلیک کن');
            map.once('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (meetingMarker) map.removeLayer(meetingMarker);

                meetingMarker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: 'meeting-icon',
                        html: '📍',
                        iconSize: [36, 36]
                    })
                }).addTo(map);
                meetingMarker.bindPopup(`<b>📍 نقطه ملاقات</b><br>${lat.toFixed(5)}, ${lng.toFixed(5)}`)
                    .openPopup();

                db.ref('meetingPoint').set({
                    lat: lat,
                    lng: lng,
                    setBy: myUsername,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                showToast('✅ نقطه ملاقات ثبت شد');
            });
        }

        // ===== دریافت نقطه ملاقات =====
        function listenMeetingPoint() {
            db.ref('meetingPoint').on('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    if (meetingMarker) {
                        map.removeLayer(meetingMarker);
                        meetingMarker = null;
                    }
                    return;
                }

                if (meetingMarker) map.removeLayer(meetingMarker);
                meetingMarker = L.marker([data.lat, data.lng], {
                    icon: L.divIcon({
                        className: 'meeting-icon',
                        html: '📍',
                        iconSize: [36, 36]
                    })
                }).addTo(map);
                meetingMarker.bindPopup(
                    `<b>📍 نقطه ملاقات</b><br>تعیین شده توسط: ${data.setBy || 'نامشخص'}`
                );
            });
        }

        // ===== خروج =====
        function removeUser() {
            if (myUsername) db.ref('locations/' + myUsername).remove();
            if (watchId) navigator.geolocation.clearWatch(watchId);
        }

        // ===== ورود =====
        function joinApp() {
            const input = document.getElementById('usernameInput');
            const name = input.value.trim();
            if (!name) {
                showToast('❌ لطفاً نام خود را وارد کن');
                input.focus();
                return;
            }
            if (name.length > 20) {
                showToast('❌ نام نباید بیشتر از ۲۰ کاراکتر باشد');
                input.focus();
                return;
            }

            myUsername = name;
            document.getElementById('login-overlay').style.display = 'none';
            initMap();
            startTracking();
            listenLocations();
            listenMeetingPoint();
            showToast('👋 خوش آمدی ' + name);

            // کیبورد رو ببند
            input.blur();
        }

        // ===== رویدادها =====
        document.getElementById('joinBtn').addEventListener('click', joinApp);
        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') joinApp();
        });
        document.getElementById('meetingPointBtn').addEventListener('click', setMeetingPoint);

        window.addEventListener('beforeunload', removeUser);

        // جلوگیری از زوم مرورگر روی نقشه
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        console.log('🔥 هم‌یاب هوشمند برای اندروید آماده است!');
        console.log('👤 با نام خود وارد شو و موقعیتت رو با بقیه به اشتراک بذار.');
    </script>
</body>
</html>
