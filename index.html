<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیاب - نقشه زنده</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0b1220;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 24px;
        }
        .loginCard {
            background: #1e293b;
            border-radius: 32px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
            border: 1px solid #334155;
            text-align: center;
        }
        .loginCard h1 {
            color: #f5c542;
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .loginCard p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .loginCard input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 16px;
            text-align: center;
        }
        .loginCard input:focus {
            border-color: #f5c542;
            outline: none;
        }
        .loginCard button {
            width: 100%;
            padding: 16px;
            background: #f5c542;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .controls {
            position: fixed;
            right: 12px;
            bottom: 120px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls button {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #usersPanel {
            position: fixed;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        #usersList {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .user-chip {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #334155;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f5c542;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 999;
            display: none;
            border: 1px solid #f5c542;
        }
        .car-marker {
            background: transparent !important;
            border: 0 !important;
        }
        .car-wrap {
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .car-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 3px solid #2563eb;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }
        .car-circle.me {
            border-color: #22c55e;
        }
        .car-name {
            margin-top: 2px;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 8px;
            white-space: nowrap;
        }
        .status-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #22c55e;
            margin-left: 3px;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="loginCard">
            <h1>🚗 همیاب</h1>
            <p>موقعیت زنده خودروها روی نقشه</p>
            <input id="nameInput" maxlength="20" placeholder="نام شما..." autofocus>
            <button id="joinBtn">🚀 ورود به نقشه</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <button id="myLocationBtn">📍</button>
        <button id="zoomInBtn">＋</button>
        <button id="zoomOutBtn">－</button>
    </div>

    <div id="usersPanel">
        <span>👥 کاربران آنلاین:</span>
        <span id="onlineCount">۰ نفر</span>
        <div id="usersList"></div>
    </div>

    <div id="toast"></div>

    <script>
        // ===== تنظیمات =====
        let map, myMarker, myName, myLat, myLng;
        const allUsers = {};
        const userMarkers = {};
        let watchId = null;

        // ===== نقشه =====
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        // ===== پیام =====
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 3000);
        }

        // ===== رنگ =====
        function userColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 75%, 52%)`;
        }

        // ===== آیکون ماشین =====
        function carIcon(name, isMe) {
            const color = isMe ? '#22c55e' : userColor(name);
            return L.divIcon({
                className: 'car-marker',
                iconSize: [70, 70],
                iconAnchor: [35, 35],
                popupAnchor: [0, -35],
                html: `
                    <div class="car-wrap">
                        <div class="car-circle ${isMe ? 'me' : ''}" style="border-color:${color}">🚗</div>
                        <div class="car-name"><span class="status-dot"></span> ${name}</div>
                    </div>
                `
            });
        }

        // ===== آپدیت لیست کاربران =====
        function updateUI() {
            const list = document.getElementById('usersList');
            const count = document.getElementById('onlineCount');
            const users = Object.keys(allUsers);
            count.textContent = users.length + ' نفر';
            list.innerHTML = users.map(u =>
                `<span class="user-chip" onclick="goToUser('${u}')">🚗 ${u}</span>`
            ).join('');
        }

        // ===== رفتن به کاربر =====
        function goToUser(name) {
            const user = allUsers[name];
            if (user && user.lat && user.lng) {
                map.setView([user.lat, user.lng], 17, { animate: true });
                toast('📍 رفتن به ' + name);
            }
        }

        // ===== موقعیت من =====
        function goToMyLocation() {
            if (myLat && myLng) {
                map.setView([myLat, myLng], 17, { animate: true });
                toast('📍 رفتن به موقعیت شما');
            }
        }

        // ===== آپدیت مارکرها =====
        function updateMarkers() {
            for (let name in allUsers) {
                const user = allUsers[name];
                if (!user.lat || !user.lng) continue;
                const isMe = (name === myName);
                if (!userMarkers[name]) {
                    const icon = carIcon(name, isMe);
                    const marker = L.marker([user.lat, user.lng], { icon, zIndexOffset: isMe ? 2000 : 0 }).addTo(map);
                    marker.bindPopup(`<b>${name}</b>${isMe ? ' (شما)' : ''}`);
                    userMarkers[name] = marker;
                } else {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                }
            }
        }

        // ===== GPS =====
        function startGPS() {
            if (!navigator.geolocation) {
                toast('❌ GPS در دسترس نیست');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    allUsers[myName] = { lat: myLat, lng: myLng };
                    updateMarkers();
                    updateUI();
                    map.setView([myLat, myLng], 16, { animate: true });
                    toast('✅ موقعیت شما ثبت شد');
                },
                err => toast('❌ خطا: ' + err.message),
                { enableHighAccuracy: true, timeout: 15000 }
            );
            watchId = navigator.geolocation.watchPosition(
                pos => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    allUsers[myName] = { lat: myLat, lng: myLng };
                    updateMarkers();
                },
                err => console.log('GPS:', err),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ===== ذخیره و بازیابی از localStorage =====
        function saveUsers() {
            localStorage.setItem('hamyab_users', JSON.stringify(allUsers));
        }

        function loadUsers() {
            const data = localStorage.getItem('hamyab_users');
            if (data) {
                const parsed = JSON.parse(data);
                for (let name in parsed) {
                    if (name !== myName) {
                        allUsers[name] = parsed[name];
                    }
                }
            }
        }

        // ===== تبادل موقعیت با localStorage (همگام‌سازی ساده) =====
        function syncUsers() {
            // هر ۳ ثانیه موقعیت‌ها رو به‌روزرسانی کن
            setInterval(() => {
                // اگر کاربر دیگه‌ای در localStorage هست، اضافه کن
                const data = localStorage.getItem('hamyab_users');
                if (data) {
                    const parsed = JSON.parse(data);
                    let changed = false;
                    for (let name in parsed) {
                        if (name !== myName && !allUsers[name]) {
                            allUsers[name] = parsed[name];
                            changed = true;
                        }
                    }
                    if (changed) {
                        updateMarkers();
                        updateUI();
                    }
                }
                // ذخیره موقعیت خودت
                if (myName && myLat && myLng) {
                    allUsers[myName] = { lat: myLat, lng: myLng };
                    localStorage.setItem('hamyab_users', JSON.stringify(allUsers));
                }
            }, 3000);
        }

        // ===== ورود =====
        function joinApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { toast('❌ نام خود را وارد کن'); return; }
            if (name.length < 2) { toast('❌ نام حداقل ۲ حرف باشد'); return; }
            myName = name;
            document.getElementById('loginOverlay').style.display = 'none';
            initMap();
            loadUsers();
            startGPS();
            syncUsers();
            // حذف کاربر هنگام خروج
            window.addEventListener('beforeunload', () => {
                delete allUsers[myName];
                localStorage.setItem('hamyab_users', JSON.stringify(allUsers));
                if (watchId) navigator.geolocation.clearWatch(watchId);
            });
        }

        // ===== رویدادها =====
        document.getElementById('joinBtn').addEventListener('click', joinApp);
        document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinApp(); });
        document.getElementById('myLocationBtn').addEventListener('click', goToMyLocation);
        document.getElementById('zoomInBtn').addEventListener('click', () => map.zoomIn());
        document.getElementById('zoomOutBtn').addEventListener('click', () => map.zoomOut());

        console.log('🚗 همیاب آماده است!');
    </script>
</body>
</html>
