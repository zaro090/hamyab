<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>محمد - ۰۹۱۶۹۰۴۴۴۵۳</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <style>
        /* ===== ریست کامل و فونت ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        /* ===== نقشه ===== */
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        /* ===== صفحه ورود (شبیه گوگل) ===== */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.93);
            backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 24px;
        }
        #login-box {
            background: #1c1c1e;
            border-radius: 32px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
            border: 1px solid #3a3a3c;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.95);
            text-align: center;
        }
        #login-box h1 {
            color: #f5c542;
            font-size: 2rem;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        #login-box p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        #login-box input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #333;
            background: #2c2c2e;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 16px;
            text-align: center;
            transition: 0.2s;
        }
        #login-box input:focus {
            border-color: #f5c542;
            outline: none;
            box-shadow: 0 0 0 4px rgba(245, 197, 66, 0.15);
            background: #1a1a1a;
        }
        #login-box button {
            width: 100%;
            padding: 16px;
            background: #f5c542;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(245, 197, 66, 0.25);
        }
        #login-box button:active {
            transform: scale(0.96);
        }
        /* ===== دکمه‌های گوگل‌مپ‌ای ===== */
        .google-controls {
            position: fixed;
            right: 12px;
            bottom: 140px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #3a3a3c;
        }
        .google-controls button {
            width: 44px;
            height: 44px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(8px);
            border: none;
            border-bottom: 1px solid #3a3a3c;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.1s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .google-controls button:last-child {
            border-bottom: none;
        }
        .google-controls button:active {
            background: #3a3a3c;
            transform: scale(0.92);
        }
        /* ===== دکمه موقعیت من (شبیه گوگل) ===== */
        .my-location-google {
            position: fixed;
            right: 12px;
            bottom: 200px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid #3a3a3c;
            color: #4a9eff;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .my-location-google:active {
            transform: scale(0.92);
            background: #3a3a3c;
        }
        /* ===== دکمه نقطه ملاقات (شبیه گوگل) ===== */
        .meeting-google {
            position: fixed;
            right: 12px;
            bottom: 80px;
            z-index: 200;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid #3a3a3c;
            color: #f5c542;
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
            min-width: 44px;
        }
        .meeting-google:active {
            transform: scale(0.92);
            background: #3a3a3c;
        }
        .meeting-google span {
            font-size: 1.2rem;
        }
        /* ===== لیست کاربران (پایین صفحه) ===== */
        #user-list {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 10px 16px;
            z-index: 100;
            border: 1px solid #3a3a3c;
            max-width: 94%;
            width: auto;
            text-align: center;
            font-size: 0.75rem;
            color: #ccc;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        #user-list span {
            display: inline-block;
            margin: 0 3px;
            padding: 3px 10px;
            border-radius: 30px;
            background: #2a2a2a;
            font-size: 0.7rem;
            pointer-events: auto;
        }
        /* ===== پیامک ===== */
        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a0e;
            color: #f5c542;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 999;
            display: none;
            border: 1px solid #f5c542;
            backdrop-filter: blur(8px);
            max-width: 92%;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }
        /* ===== پاپ‌آپ گوگل‌مپ‌ای ===== */
        .leaflet-popup-content-wrapper {
            border-radius: 16px !important;
            background: #1c1c1e !important;
            color: #f0f0f0 !important;
            border: 1px solid #3a3a3c;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
        }
        .leaflet-popup-tip {
            background: #1c1c1e !important;
        }
        .leaflet-popup-content {
            font-family: 'Vazirmatn', sans-serif !important;
            font-size: 0.85rem !important;
            text-align: center;
            padding: 4px 0;
            min-width: 130px;
        }
        /* ===== دقت GPS ===== */
        #accuracy-badge {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            color: #aaa;
            font-size: 0.6rem;
            padding: 4px 14px;
            border-radius: 30px;
            z-index: 150;
            border: 1px solid #2a2a2a;
            display: none;
            font-family: 'Vazirmatn', sans-serif;
        }
        #accuracy-badge span {
            color: #4a9eff;
        }
        /* ===== استایل ماشین ===== */
        .car-marker {
            background: transparent;
            border: none;
            text-align: center;
            filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.7));
            transition: transform 0.3s;
        }
        .car-marker .car-icon {
            font-size: 2rem;
            display: block;
            line-height: 1;
        }
        .car-marker .car-name {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 0.55rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: -4px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            font-family: 'Vazirmatn', sans-serif;
        }
        .car-marker.my-car .car-name {
            background: #4a9eff;
            color: #fff;
            border-color: #4a9eff;
        }
        .car-marker .car-name .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            margin-left: 4px;
        }
        .car-marker .car-name .online-dot {
            background: #4caf50;
        }
        .car-marker .car-name .offline-dot {
            background: #888;
        }
        /* ===== ریسپانسیو ===== */
        @media (max-width: 480px) {
            #login-box {
                padding: 24px 16px;
            }
            #login-box h1 {
                font-size: 1.5rem;
            }
            .google-controls button,
            .my-location-google {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .meeting-google {
                padding: 6px 8px;
                font-size: 0.6rem;
                min-width: 38px;
            }
            #user-list {
                font-size: 0.65rem;
                padding: 8px 12px;
                bottom: 12px;
            }
            .toast {
                font-size: 0.7rem;
                padding: 8px 16px;
                top: 12px;
            }
            #accuracy-badge {
                font-size: 0.55rem;
                padding: 3px 10px;
                bottom: 70px;
            }
        }
        ::-webkit-scrollbar {
            display: none;
        }
        /* ===== استایل شب/روز ===== */
        .leaflet-tile-pane {
            filter: brightness(0.95) contrast(1.05);
        }
        @media (prefers-color-scheme: dark) {
            .leaflet-tile-pane {
                filter: brightness(0.85) contrast(1.1) saturate(0.9);
            }
        }
    </style>
</head>
<body>

    <!-- ===== صفحه ورود ===== -->
    <div id="login-overlay">
        <div id="login-box">
            <h1>🚗 همیاب</h1>
            <p>موقعیت زنده خودروها روی نقشه</p>
            <input type="text" id="usernameInput" placeholder="نام خود را وارد کن..." maxlength="20" autofocus />
            <button id="joinBtn">🚀 ورود به نقشه</button>
        </div>
    </div>

    <!-- ===== نقشه ===== -->
    <div id="map"></div>

    <!-- ===== دکمه‌های شبیه گوگل ===== -->
    <div class="google-controls">
        <button id="zoomInBtn" title="بزرگنمایی">➕</button>
        <button id="zoomOutBtn" title="کوچکنمایی">➖</button>
    </div>

    <button class="my-location-google" id="myLocationBtn" title="موقعیت من">📍</button>

    <button class="meeting-google" id="meetingPointBtn" title="نقطه ملاقات">
        <span>📍</span>
        ملاقات
    </button>

    <!-- ===== لیست کاربران ===== -->
    <div id="user-list">
        <span style="color:#aaa;">🚗 آنلاین:</span>
        <span id="onlineUsers">هیچکس</span>
    </div>

    <!-- ===== دقت GPS ===== -->
    <div id="accuracy-badge">🎯 دقت: <span id="accuracyValue">--</span> متر</div>

    <!-- ===== پیامک ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== Firebase SDK ===== -->
    <script>
        // ===== Firebase =====
        const firebaseConfig = {
            apiKey: "AIzaSyBV_HPvDfrG7npGtDfA8wrk0XRtq4s5c4k",
            authDomain: "location-tracker-e732b.firebaseapp.com",
            projectId: "location-tracker-e732b",
            storageBucket: "location-tracker-e732b.firebasestorage.app",
            messagingSenderId: "425589009128",
            appId: "1:425589009128:web:759e3b6b614434eb75775d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ===== متغیرها =====
        let map;
        let userMarkers = {};
        let userPaths = {};
        let myUsername = '';
        let myLat = 0,
            myLng = 0;
        let myAccuracy = 0;
        let watchId = null;
        let meetingMarker = null;
        let myMarker = null;
        let isFirstLocation = true;

        // ===== نقشه =====
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                fadeAnimation: true,
                attributionControl: true
            }).setView([35.6892, 51.3890], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap',
                subdomains: 'abc'
            }).addTo(map);

            map.touchZoom = true;
            map.doubleClickZoom = true;
            map.scrollWheelZoom = true;

            // کنترلرهای بزرگنمایی مخفی (خودمون داریم)
            map.zoomControl = false;
        }

        // ===== امنیت نام =====
        function sanitize(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;', '/': '&#x2F;' };
            return str.replace(/[&<>"'/]/g, function(m) { return map[m]; });
        }

        // ===== پیام =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 2500);
        }

        // ===== مسافت =====
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ===== ساخت آیکون ماشین =====
        function createCarIcon(username, isMyCar = false, isOnline = true) {
            const safeName = sanitize(username);
            const color = isMyCar ? '#4a9eff' : stringToColor(username);
            return L.divIcon({
                className: 'car-marker' + (isMyCar ? ' my-car' : ''),
                html: `
                    <div class="car-icon">🚗</div>
                    <div class="car-name" style="background:${color}; color:#fff; border-color:${color};">
                        ${safeName}
                        <span class="dot ${isOnline ? 'online-dot' : 'offline-dot'}"></span>
                    </div>
                `,
                iconSize: [60, 60],
                iconAnchor: [30, 30],
                popupAnchor: [0, -30]
            });
        }

        // ===== رنگ =====
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 80%, 55%)`;
        }

        // ===== GPS =====
        function startTracking() {
            if (!navigator.geolocation) {
                showToast('❌ گوشی شما GPS ندارد!');
                return;
            }
            const options = {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 3000
            };
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    myAccuracy = pos.coords.accuracy;
                    updateAccuracy();
                    sendLocation();
                    updateMyLocation();
                    showToast('✅ موقعیت شما ثبت شد');
                },
                function(err) {
                    showToast('❌ خطا: ' + err.message);
                },
                options
            );
            watchId = navigator.geolocation.watchPosition(
                function(pos) {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    myAccuracy = pos.coords.accuracy;
                    updateAccuracy();
                    sendLocation();
                    updateMyLocation();
                },
                function(err) { console.log('خطا:', err); },
                options
            );
        }

        // ===== نمایش دقت =====
        function updateAccuracy() {
            const badge = document.getElementById('accuracy-badge');
            const value = document.getElementById('accuracyValue');
            if (myAccuracy > 0) {
                badge.style.display = 'block';
                value.textContent = Math.round(myAccuracy);
            } else {
                badge.style.display = 'none';
            }
        }

        // ===== به‌روزرسانی موقعیت خودم =====
        function updateMyLocation() {
            if (!map || myLat === 0 || myLng === 0) return;
            if (myMarker) map.removeLayer(myMarker);
            const icon = createCarIcon(myUsername, true, true);
            myMarker = L.marker([myLat, myLng], { icon }).addTo(map);
            myMarker.bindPopup(`<b>${sanitize(myUsername)}</b> (شما)<br>🚗 در حال حرکت<br>🎯 دقت: ${Math.round(myAccuracy)} متر`);
            if (isFirstLocation) {
                map.setView([myLat, myLng], 16);
                isFirstLocation = false;
            }
        }

        // ===== ارسال =====
        function sendLocation() {
            if (!myUsername || myLat === 0 || myLng === 0) return;
            db.ref('locations/' + myUsername).set({
                lat: myLat,
                lng: myLng,
                name: myUsername,
                accuracy: myAccuracy,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // ===== دریافت موقعیت همه =====
        function listenLocations() {
            db.ref('locations').on('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    for (let key in userMarkers) map.removeLayer(userMarkers[key]);
                    userMarkers = {};
                    userPaths = {};
                    document.getElementById('onlineUsers').textContent = 'هیچکس';
                    return;
                }
                const now = Date.now();
                const onlineList = [];
                const newMarkers = {};
                for (let username in data) {
                    const loc = data[username];
                    if (!loc.lat || !loc.lng) continue;
                    const timeDiff = (now - loc.timestamp) / 1000 / 60;
                    const isOnline = timeDiff < 5;
                    if (isOnline && username !== myUsername) onlineList.push(username);
                    let distanceText = '';
                    if (myLat && myLng && username !== myUsername) {
                        const dist = calculateDistance(myLat, myLng, loc.lat, loc.lng);
                        if (dist < 1) {
                            distanceText = `<br>📏 ${(dist * 1000).toFixed(0)} متر`;
                        } else {
                            distanceText = `<br>📏 ${dist.toFixed(1)} کیلومتر`;
                        }
                    }
                    let popup = `<b>${sanitize(username)}</b>`;
                    if (username === myUsername) popup += ` (شما)`;
                    if (distanceText) popup += distanceText;
                    if (loc.accuracy) popup += `<br>🎯 دقت: ${Math.round(loc.accuracy)} متر`;
                    popup += `<br>${isOnline ? '🟢 آنلاین' : '⏰ ' + Math.round(timeDiff) + ' دقیقه پیش'}`;
                    const isMyCar = (username === myUsername);
                    const icon = createCarIcon(username, isMyCar, isOnline);
                    if (!userMarkers[username]) {
                        const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(map);
                        marker.bindPopup(popup);
                        userMarkers[username] = marker;
                        userPaths[username] = L.polyline([], {
                            color: isMyCar ? '#4a9eff' : stringToColor(username),
                            weight: 3,
                            opacity: 0.5,
                            smoothFactor: 1
                        }).addTo(map);
                    } else {
                        const oldLatLng = userMarkers[username].getLatLng();
                        const lerpFactor = 0.3;
                        const newLat = oldLatLng.lat + (loc.lat - oldLatLng.lat) * lerpFactor;
                        const newLng = oldLatLng.lng + (loc.lng - oldLatLng.lng) * lerpFactor;
                        userMarkers[username].setLatLng([newLat, newLng]);
                        userMarkers[username].setIcon(icon);
                        userMarkers[username].setPopupContent(popup);
                        const path = userPaths[username];
                        const latlngs = path.getLatLngs();
                        latlngs.push([loc.lat, loc.lng]);
                        if (latlngs.length > 150) latlngs.shift();
                        path.setLatLngs(latlngs);
                    }
                    newMarkers[username] = userMarkers[username];
                }
                for (let username in userMarkers) {
                    if (!newMarkers[username]) {
                        map.removeLayer(userMarkers[username]);
                        if (userPaths[username]) {
                            map.removeLayer(userPaths[username]);
                            delete userPaths[username];
                        }
                        delete userMarkers[username];
                    }
                }
                document.getElementById('onlineUsers').textContent =
                    onlineList.length > 0 ? onlineList.join(' - ') : 'هیچکس';
            });
        }

        // ===== نقطه ملاقات =====
        function setMeetingPoint() {
            if (!map) return;
            showToast('📍 روی نقشه کلیک کن');
            map.once('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                if (meetingMarker) map.removeLayer(meetingMarker);
                meetingMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'meeting-icon', html: '📍', iconSize: [32, 32] })
                }).addTo(map);
                meetingMarker.bindPopup(`<b>📍 نقطه ملاقات</b>`).openPopup();
                db.ref('meetingPoint').set({
                    lat: lat,
                    lng: lng,
                    setBy: myUsername,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                showToast('✅ نقطه ملاقات ثبت شد');
            });
        }

        // ===== دریافت نقطه ملاقات =====
        function listenMeetingPoint() {
            db.ref('meetingPoint').on('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    if (meetingMarker) { map.removeLayer(meetingMarker);
                        meetingMarker = null; }
                    return;
                }
                if (meetingMarker) map.removeLayer(meetingMarker);
                meetingMarker = L.marker([data.lat, data.lng], {
                    icon: L.divIcon({ className: 'meeting-icon', html: '📍', iconSize: [32, 32] })
                }).addTo(map);
                meetingMarker.bindPopup(`<b>📍 نقطه ملاقات</b><br>تعیین شده توسط: ${sanitize(data.setBy || 'نامشخص')}`);
            });
        }

        // ===== رفتن به موقعیت من =====
        function goToMyLocation() {
            if (myLat && myLng) {
                map.setView([myLat, myLng], 16);
                showToast('📍 رفتن به موقعیت شما');
            } else {
                showToast('❌ موقعیت شما هنوز ثبت نشده');
            }
        }

        // ===== خروج =====
        function removeUser() {
            if (myUsername) db.ref('locations/' + myUsername).remove();
            if (watchId) navigator.geolocation.clearWatch(watchId);
        }

        // ===== ورود =====
        function joinApp() {
            const input = document.getElementById('usernameInput');
            const name = input.value.trim();
            if (!name) {
                showToast('❌ لطفاً نام خود را وارد کن');
                input.focus();
                return;
            }
            if (name.length > 20) {
                showToast('❌ نام نباید بیشتر از ۲۰ کاراکتر باشد');
                input.focus();
                return;
            }
            if (/[&<>"'/]/.test(name)) {
                showToast('❌ نام شامل کاراکترهای غیرمجاز است');
                input.focus();
                return;
            }
            myUsername = name;
            document.getElementById('login-overlay').style.display = 'none';
            initMap();
            startTracking();
            listenLocations();
            listenMeetingPoint();
            showToast('👋 خوش آمدی ' + sanitize(name));
            input.blur();
        }

        // ===== رویدادها =====
        document.getElementById('joinBtn').addEventListener('click', joinApp);
        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') joinApp();
        });
        document.getElementById('zoomInBtn').addEventListener('click', function() { map.zoomIn(); });
        document.getElementById('zoomOutBtn').addEventListener('click', function() { map.zoomOut(); });
        document.getElementById('myLocationBtn').addEventListener('click', goToMyLocation);
        document.getElementById('meetingPointBtn').addEventListener('click', setMeetingPoint);
        window.addEventListener('beforeunload', removeUser);
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        console.log('🔥 نقشه محمد ۰۹۱۶۹۰۴۴۴۵۳ آماده است!');
        console.log('📱 با نام خود وارد شو و حرکت زنده خودروها رو ببین.');
    </script>
</body>
    </html>
