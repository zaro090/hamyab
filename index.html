<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>همیاب | نقشه زنده</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#map{width:100%;height:100%;overflow:hidden}
body{font-family:Vazirmatn,sans-serif;background:#111827;color:#fff}

#map{position:fixed;inset:0;z-index:1}

#login{
 position:fixed;inset:0;z-index:5000;
 display:flex;align-items:center;justify-content:center;
 padding:20px;
 background:rgba(3,7,18,.96);
 backdrop-filter:blur(18px)
}

.card{
 width:min(410px,100%);
 padding:30px 22px;
 border-radius:28px;
 background:#111827;
 border:1px solid #374151;
 box-shadow:0 25px 80px #000;
 text-align:center
}

.logo{
 width:78px;height:78px;margin:auto auto 15px;
 border-radius:24px;
 display:flex;align-items:center;justify-content:center;
 background:#f5c542;
 font-size:40px
}

h1{color:#f5c542;font-size:30px;margin-bottom:5px}
.sub{color:#9ca3af;font-size:13px;line-height:1.9;margin-bottom:22px}

input{
 width:100%;
 padding:16px;
 border-radius:16px;
 border:1px solid #374151;
 background:#1f2937;
 color:#fff;
 outline:none;
 font:inherit;
 text-align:center
}

input:focus{border-color:#f5c542}

.join{
 width:100%;
 margin-top:12px;
 padding:16px;
 border:0;
 border-radius:16px;
 background:#f5c542;
 color:#111;
 font:inherit;
 font-weight:800
}

.note{font-size:10px;color:#6b7280;margin-top:14px;line-height:1.8}

.top{
 position:fixed;
 top:12px;left:12px;right:12px;
 z-index:1000;
 display:flex;
 justify-content:space-between;
 pointer-events:none
}

.brand,.status{
 background:rgba(17,24,39,.92);
 border:1px solid rgba(255,255,255,.12);
 backdrop-filter:blur(15px);
 box-shadow:0 8px 30px rgba(0,0,0,.3);
 border-radius:17px
}

.brand{
 padding:8px 12px;
 display:flex;align-items:center;gap:8px
}

.brandIcon{
 width:30px;height:30px;
 border-radius:10px;
 background:#f5c542;
 display:flex;align-items:center;justify-content:center
}

.brandName{color:#f5c542;font-weight:800;font-size:13px}
.brandSub{font-size:8px;color:#9ca3af}

.status{
 padding:10px 13px;
 font-size:10px;
 color:#d1d5db
}

.dot{
 display:inline-block;
 width:7px;height:7px;
 border-radius:50%;
 background:#22c55e;
 margin-left:5px
}

.status.offline .dot{background:#ef4444}

.controls{
 position:fixed;
 right:12px;
 bottom:145px;
 z-index:1000;
 display:flex;
 flex-direction:column;
 gap:8px
}

.ctrl{
 width:47px;height:47px;
 border:1px solid rgba(255,255,255,.12);
 border-radius:15px;
 background:rgba(17,24,39,.94);
 color:#fff;
 font-size:20px;
 box-shadow:0 7px 25px rgba(0,0,0,.35)
}

#panel{
 position:fixed;
 left:12px;right:12px;
 bottom:12px;
 z-index:1100;
 background:rgba(17,24,39,.94);
 border:1px solid rgba(255,255,255,.1);
 border-radius:21px;
 backdrop-filter:blur(20px);
 box-shadow:0 12px 40px rgba(0,0,0,.4);
 overflow:hidden
}

.panelHead{
 padding:12px 15px;
 display:flex;
 justify-content:space-between;
 font-size:12px;
 font-weight:700
}

.online{color:#22c55e}

#users{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:0 12px 12px;
 scrollbar-width:none
}

#users::-webkit-scrollbar{display:none}

.user{
 flex:0 0 auto;
 padding:7px 10px;
 border-radius:13px;
 background:#1f2937;
 border:1px solid rgba(255,255,255,.07);
 font-size:10px
}

.carMarker{background:transparent!important;border:0!important}

.car{
 width:76px;
 height:72px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center
}

.carCircle{
 width:42px;height:42px;
 border-radius:50%;
 background:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:23px;
 border:3px solid #2563eb;
 box-shadow:0 4px 15px rgba(0,0,0,.4)
}

.carCircle.me{border-color:#22c55e}

.name{
 margin-top:2px;
 padding:3px 8px;
 border-radius:12px;
 background:rgba(17,24,39,.94);
 border:1px solid rgba(255,255,255,.15);
 font-size:8px;
 white-space:nowrap;
 max-width:75px;
 overflow:hidden;
 text-overflow:ellipsis
}

#toast{
 position:fixed;
 top:75px;
 left:50%;
 transform:translateX(-50%);
 z-index:4000;
 display:none;
 max-width:90%;
 padding:10px 18px;
 border-radius:25px;
 background:#111827;
 border:1px solid #374151;
 color:#fff;
 font-size:11px;
 text-align:center;
 box-shadow:0 10px 35px #000
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
 background:#111827!important;
 color:#fff!important
}

.leaflet-popup-content{
 font-family:Vazirmatn,sans-serif!important;
 text-align:center;
 font-size:11px;
 line-height:2
}
</style>
</head>

<body>

<div id="login">
 <div class="card">
  <div class="logo">🚗</div>
  <h1>همیاب</h1>
  <div class="sub">
   نقشه زنده گروهی<br>
   موقعیت افرادی که با رضایت خودشان وارد شده‌اند روی نقشه نمایش داده می‌شود.
  </div>

  <input id="name" maxlength="30" placeholder="نام شما...">
  <button class="join" id="join">🚀 ورود به نقشه</button>

  <div class="note">
   برای نمایش موقعیت شما، اجازه دسترسی به Location گوشی اندروید را تأیید کنید.
  </div>
 </div>
</div>

<div id="map"></div>

<div class="top">
 <div class="brand">
  <div class="brandIcon">🚗</div>
  <div>
   <div class="brandName">همیاب</div>
   <div class="brandSub">نقشه زنده</div>
  </div>
 </div>

 <div id="status" class="status">
  <span class="dot"></span>اتصال
 </div>
</div>

<div class="controls">
 <button class="ctrl" id="me">📍</button>
 <button class="ctrl" id="all">👥</button>
 <button class="ctrl" id="plus">＋</button>
 <button class="ctrl" id="minus">－</button>
</div>

<div id="panel">
 <div class="panelHead">
  <span>👥 افراد روی نقشه</span>
  <span id="count" class="online">۰ نفر</span>
 </div>
 <div id="users"></div>
</div>

<div id="toast"></div>

<script>
/* =========================
   FIREBASE
========================= */

const firebaseConfig={
 apiKey:"AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",
 authDomain:"location-tracker-e732b.firebaseapp.com",
 databaseURL:"https://location-tracker-e732b-default-rtdb.firebaseio.com",
 projectId:"location-tracker-e732b",
 storageBucket:"location-tracker-e732b.firebasestorage.app",
 messagingSenderId:"425589009128",
 appId:"1:425589009128:web:759e3b6b614434eb75775d"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* =========================
   VARIABLES
========================= */

let map=null;
let myId=null;
let myName="";
let myLat=null;
let myLng=null;
let myAccuracy=null;
let watchId=null;
let firstGPS=true;

const locationCache={};
const markers={};

/* =========================
   HELPERS
========================= */

function uid(){
 let id=localStorage.getItem("hamyab_uid");

 if(!id){
  id="u_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
  localStorage.setItem("hamyab_uid",id);
 }

 return id;
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;
 el.style.display="block";

 clearTimeout(el.timer);

 el.timer=setTimeout(()=>{
  el.style.display="none";
 },2800);
}

function online(u){
 return u &&
        typeof u.timestamp==="number" &&
        Date.now()-u.timestamp<120000;
}

function color(name){
 let h=0;

 for(let i=0;i<name.length;i++){
  h=name.charCodeAt(i)+((h<<5)-h);
 }

 return `hsl(${Math.abs(h)%360},75%,52%)`;
}

/* =========================
   MAP
========================= */

function initMap(){

 map=L.map("map",{
  zoomControl:false,
  attributionControl:true
 }).setView([35.6892,51.3890],5);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap contributors"
  }
 ).addTo(map);
}

/* =========================
   ICON
========================= */

function icon(user,isMe){

 const c=isMe?"#22c55e":color(user.name||"کاربر");

 return L.divIcon({
  className:"carMarker",
  iconSize:[76,72],
  iconAnchor:[38,36],
  popupAnchor:[0,-35],

  html:`
   <div class="car">
    <div
     class="carCircle ${isMe?"me":""}"
     style="border-color:${c}"
    >🚗</div>

    <div class="name">
     ${esc(user.name||"کاربر")}
    </div>
   </div>
  `
 });
}

/* =========================
   POPUP
========================= */

function popup(user){

 const me=user.id===myId;

 let distance="";

 if(
  !me &&
  myLat!==null &&
  myLng!==null &&
  typeof user.lat==="number" &&
  typeof user.lng==="number"
 ){

  const d=distanceMeters(
   myLat,myLng,
   user.lat,user.lng
  );

  distance="<br>📏 فاصله: "+formatDistance(d);
 }

 const time=user.timestamp
  ?new Date(user.timestamp).toLocaleTimeString(
   "fa-IR",
   {hour:"2-digit",minute:"2-digit"}
  )
  :"نامشخص";

 return `
 <strong>${esc(user.name||"کاربر")}</strong>
 ${me?"<br>🟢 این شما هستید":""}
 <br>${online(user)?"🟢 آنلاین":"⚪ آخرین موقعیت"}
 ${distance}
 ${user.accuracy?`<br>🎯 دقت GPS: ${Math.round(user.accuracy)} متر`:""}
 <br>🕐 ${time}
 `;
}

/* =========================
   DISTANCE
========================= */

function distanceMeters(a,b,c,d){

 const R=6371000;

 const x=(c-a)*Math.PI/180;
 const y=(d-b)*Math.PI/180;

 const q=
 Math.sin(x/2)**2+
 Math.cos(a*Math.PI/180)*
 Math.cos(c*Math.PI/180)*
 Math.sin(y/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(q),
  Math.sqrt(1-q)
 );
}

function formatDistance(m){
 return m<1000
  ?Math.round(m)+" متر"
  :(m/1000).toFixed(1)+" کیلومتر";
}

/* =========================
   MARKER
========================= */

function updateMarker(id,user){

 if(
  !user ||
  typeof user.lat!=="number" ||
  typeof user.lng!=="number"
 )return;

 const isMe=id===myId;

 if(!markers[id]){

  const marker=L.marker(
   [user.lat,user.lng],
   {
    icon:icon(user,isMe),
    zIndexOffset:isMe?2000:0
   }
  ).addTo(map);

  marker.bindPopup(popup(user));

  markers[id]=marker;

 }else{

  markers[id].setLatLng([
   user.lat,
   user.lng
  ]);

  markers[id].setIcon(
   icon(user,isMe)
  );

  markers[id].setPopupContent(
   popup(user)
  );
 }
}

/* =========================
   REMOVE
========================= */

function removeMarker(id){

 if(markers[id]){

  map.removeLayer(markers[id]);

  delete markers[id];
 }
}

/* =========================
   USER LIST
========================= */

function updateUsers(){

 const box=document.getElementById("users");
 const count=document.getElementById("count");

 const users=Object.values(locationCache);

 const onlineUsers=users.filter(online);

 count.textContent=onlineUsers.length+" نفر";

 box.innerHTML="";

 users
 .sort((a,b)=>Number(online(b))-Number(online(a)))
 .forEach(user=>{

  const el=document.createElement("div");

  el.className="user";

  el.textContent=
   (online(user)?"🟢 ":"⚪ ")+
   (user.name||"کاربر");

  el.onclick=()=>{

   if(
    typeof user.lat==="number" &&
    typeof user.lng==="number"
   ){

    map.setView(
     [user.lat,user.lng],
     17,
     {animate:true}
    );

    if(markers[user.id]){
     markers[user.id].openPopup();
    }
   }
  };

  box.appendChild(el);
 });

 if(!users.length){

  box.innerHTML=
   `<div style="font-size:10px;color:#9ca3af">
    هنوز کاربری روی نقشه نیست
   </div>`;
 }
}

/* =========================
   REALTIME LISTENER
   این قسمت مشکل نسخه قبلی را حل می‌کند
========================= */

function listenLocations(){

 db.ref("locations").on(
  "value",

  snapshot=>{

   const data=snapshot.val()||{};

   /* حذف کاربران دیگر که از Firebase حذف شده‌اند */
   Object.keys(locationCache).forEach(id=>{

    if(!data[id]){

     delete locationCache[id];

     removeMarker(id);
    }
   });

   /* دریافت تک تک کاربران */
   Object.keys(data).forEach(id=>{

    const loc=data[id];

    if(
     !loc ||
     typeof loc.lat!=="number" ||
     typeof loc.lng!=="number"
    ){
     return;
    }

    /*
      نکته مهم:
      اطلاعات کاربر دیگر اینجا وارد locationCache می‌شود.
    */

    locationCache[id]={
     id:id,
     name:loc.name||"کاربر",
     lat:loc.lat,
     lng:loc.lng,
     accuracy:loc.accuracy||null,
     timestamp:
      typeof loc.timestamp==="number"
      ?loc.timestamp
      :0
    };

    updateMarker(
     id,
     locationCache[id]
    );
   });

   updateUsers();
  },

  error=>{
   console.error(error);
   toast("❌ خطا در دریافت اطلاعات");
  }
 );
}

/* =========================
   SEND LOCATION
========================= */

let lastLat=null;
let lastLng=null;
let lastTime=0;

function sendLocation(){

 if(
  !myId ||
  !myName ||
  myLat===null ||
  myLng===null
 )return;

 const now=Date.now();

 let moved=Infinity;

 if(lastLat!==null){

  moved=distanceMeters(
   lastLat,
   lastLng,
   myLat,
   myLng
  );
 }

 /*
   هر 5 ثانیه یا بعد از حداقل 5 متر
 */
 if(
  now-lastTime<5000 &&
  moved<5
 ){
  return;
 }

 lastLat=myLat;
 lastLng=myLng;
 lastTime=now;

 db.ref(
  "locations/"+myId
 ).set({

  id:myId,
  name:myName,
  lat:myLat,
  lng:myLng,
  accuracy:myAccuracy,
  timestamp:
   firebase.database.ServerValue.TIMESTAMP

 }).catch(err=>{
  console.error(err);
  toast("❌ ارسال موقعیت انجام نشد");
 });
}

/* =========================
   GPS
========================= */

function startGPS(){

 if(!navigator.geolocation){

  toast("❌ GPS این مرورگر در دسترس نیست");
  return;
 }

 const options={
  enableHighAccuracy:true,
  timeout:20000,
  maximumAge:2000
 };

 navigator.geolocation.getCurrentPosition(
  positionReceived,
  gpsError,
  options
 );

 watchId=
 navigator.geolocation.watchPosition(
  positionReceived,
  gpsError,
  options
 );
}

function positionReceived(pos){

 myLat=pos.coords.latitude;
 myLng=pos.coords.longitude;
 myAccuracy=pos.coords.accuracy;

 /*
   اول اطلاعات خودمان را محلی هم وارد cache می‌کنیم
   تا بلافاصله روی نقشه دیده شویم.
 */
 locationCache[myId]={
  id:myId,
  name:myName,
  lat:myLat,
  lng:myLng,
  accuracy:myAccuracy,
  timestamp:Date.now()
 };

 updateMarker(
  myId,
  locationCache[myId]
 );

 updateUsers();

 sendLocation();

 if(firstGPS){

  firstGPS=false;

  map.setView(
   [myLat,myLng],
   16,
   {animate:true}
  );

  toast(
   "✅ موقعیت شما ثبت شد"
  );
 }
}

function gpsError(err){

 console.warn("GPS",err);

 if(err.code===1){

  toast(
   "❌ اجازه Location داده نشده است"
  );

 }else if(err.code===2){

  toast(
   "⚠️ موقعیت GPS در دسترس نیست"
  );

 }else if(err.code===3){

  toast(
   "⚠️ دریافت GPS طول کشید"
  );
 }
}

/* =========================
   PRESENCE
========================= */

function setupPresence(){

 const ref=
  db.ref("locations/"+myId);

 /*
   وقتی اتصال اینترنت قطع شد،
   رکورد کاربر حذف می‌شود.
 */
 ref.onDisconnect()
 .remove()
 .catch(console.error);

 db.ref(".info/connected")
 .on("value",snap=>{

  if(snap.val()!==true)return;

  ref.set({

   id:myId,
   name:myName,
   lat:myLat||0,
   lng:myLng||0,
   accuracy:myAccuracy||null,
   timestamp:
    firebase.database.ServerValue.TIMESTAMP

  }).catch(console.error);
 });
}

/* =========================
   CONNECTION
========================= */

function setupConnection(){

 const status=
  document.getElementById("status");

 db.ref(".info/connected")
 .on("value",snap=>{

  if(snap.val()===true){

   status.classList.remove("offline");

   status.innerHTML=
    '<span class="dot"></span>آنلاین';

  }else{

   status.classList.add("offline");

   status.innerHTML=
    '<span class="dot"></span>قطع اتصال';
  }
 });
}

/* =========================
   BUTTONS
========================= */

function myLocation(){

 if(
  myLat===null ||
  myLng===null
 ){

  toast(
   "⏳ هنوز موقعیت GPS دریافت نشده"
  );

  return;
 }

 map.setView(
  [myLat,myLng],
  17,
  {animate:true}
 );

 if(markers[myId]){
  markers[myId].openPopup();
 }
}

function showAll(){

 const points=
  Object.values(locationCache)
  .filter(u=>
   online(u) &&
   typeof u.lat==="number" &&
   typeof u.lng==="number"
  )
  .map(u=>[
   u.lat,
   u.lng
  ]);

 if(!points.length){

  toast(
   "👥 کاربر آنلاینی پیدا نشد"
  );

  return;
 }

 if(points.length===1){

  map.setView(
   points[0],
   16,
   {animate:true}
  );

  return;
 }

 map.fitBounds(
  L.latLngBounds(points),
  {
   padding:[90,90],
   maxZoom:16,
   animate:true
  }
 );
}

/* =========================
   CLEANUP
========================= */

function cleanup(){

 if(watchId!==null){

  navigator.geolocation
  .clearWatch(watchId);
 }

 /*
   حذف مستقیم هنگام خروج ممکن است در بعضی مرورگرها
   اجرا نشود؛ onDisconnect راه مطمئن‌تر است.
 */
}

/* =========================
   JOIN
========================= */

function join(){

 const input=
  document.getElementById("name");

 const name=
  input.value.trim();

 if(!name){

  toast("❌ نام خود را وارد کن");
  input.focus();
  return;
 }

 if(name.length<2){

  toast("❌ نام حداقل ۲ حرف باشد");
  return;
 }

 myName=name;
 myId=uid();

 document.getElementById(
  "login"
 ).style.display="none";

 initMap();

 setupConnection();

 setupPresence();

 listenLocations();

 startGPS();

 toast(
  "👋 خوش آمدی "+myName
 );
}

/* =========================
   EVENTS
========================= */

document
.getElementById("join")
.addEventListener(
 "click",
 join
);

document
.getElementById("name")
.addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter"){
   join();
  }
 }
);

document
.getElementById("me")
.addEventListener(
 "click",
 myLocation
);

document
.getElementById("all")
.addEventListener(
 "click",
 showAll
);

document
.getElementById("plus")
.addEventListener(
 "click",
 ()=>{
  if(map)map.zoomIn();
 }
);

document
.getElementById("minus")
.addEventListener(
 "click",
 ()=>{
  if(map)map.zoomOut();
 }
);

window.addEventListener(
 "beforeunload",
 cleanup
);

/*
  اگر کاربر تب را دوباره باز کرد،
  GPS دوباره فعال شود.
*/
document.addEventListener(
 "visibilitychange",
 ()=>{
  if(
   document.visibilityState==="visible" &&
