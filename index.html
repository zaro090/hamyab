<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>همیاب | نقشه زنده</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#map{width:100%;height:100%;overflow:hidden}
body{font-family:Vazirmatn,sans-serif;background:#0f172a;color:white}

#map{position:fixed;inset:0}

#login{
position:fixed;inset:0;z-index:5000;
display:flex;align-items:center;justify-content:center;
padding:20px;
background:rgba(2,6,23,.96);
backdrop-filter:blur(15px)
}

.card{
width:min(390px,100%);
background:#111827;
border:1px solid #334155;
border-radius:28px;
padding:30px 22px;
text-align:center;
box-shadow:0 25px 80px #0008
}

.logo{
width:75px;height:75px;
margin:auto auto 15px;
border-radius:22px;
display:flex;align-items:center;justify-content:center;
font-size:38px;
background:#f5c542
}

h1{color:#f5c542;margin-bottom:8px}
.subtitle{color:#94a3b8;font-size:13px;line-height:2;margin-bottom:22px}

input{
width:100%;
padding:15px;
border-radius:15px;
border:1px solid #334155;
background:#0f172a;
color:white;
font-family:inherit;
text-align:center;
font-size:16px;
outline:none
}

input:focus{border-color:#f5c542}

.join{
width:100%;
margin-top:12px;
padding:15px;
border:0;
border-radius:15px;
background:#f5c542;
font-family:inherit;
font-weight:bold;
font-size:16px
}

.top{
position:fixed;
z-index:1000;
top:12px;
left:12px;
right:12px;
display:flex;
justify-content:space-between;
pointer-events:none
}

.brand,.status{
background:#0f172add;
border:1px solid #334155;
border-radius:18px;
padding:9px 13px;
backdrop-filter:blur(15px);
font-size:12px
}

.brand{color:#f5c542;font-weight:bold}
.status{color:#22c55e}

.dot{
display:inline-block;
width:7px;height:7px;
border-radius:50%;
background:#22c55e;
margin-left:5px
}

.offline .dot{background:#ef4444}

.controls{
position:fixed;
right:12px;
bottom:155px;
z-index:1000;
display:flex;
flex-direction:column;
gap:8px
}

.controls button{
width:48px;height:48px;
border-radius:15px;
border:1px solid #334155;
background:#0f172add;
color:white;
font-size:20px
}

#panel{
position:fixed;
z-index:1000;
left:12px;right:12px;
bottom:12px;
background:#0f172aed;
border:1px solid #334155;
border-radius:22px;
padding:12px;
backdrop-filter:blur(18px)
}

.panelHead{
display:flex;
justify-content:space-between;
font-size:12px;
color:#cbd5e1
}

.count{color:#22c55e;font-weight:bold}

#users{
display:flex;
gap:7px;
overflow-x:auto;
padding-top:9px
}

.user{
flex:0 0 auto;
padding:7px 11px;
border-radius:13px;
background:#1e293b;
border:1px solid #334155;
font-size:11px;
cursor:pointer
}

#toast{
position:fixed;
z-index:6000;
top:70px;
left:50%;
transform:translateX(-50%);
display:none;
background:#111827;
border:1px solid #f5c542;
color:#f5c542;
padding:10px 17px;
border-radius:30px;
font-size:12px;
white-space:nowrap
}

.car{
width:65px;height:65px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.carIcon{
width:38px;height:38px;
border-radius:50%;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
border:3px solid #2563eb;
box-shadow:0 4px 15px #0008
}

.carIcon.me{border-color:#22c55e}

.carName{
margin-top:2px;
padding:2px 7px;
background:#111827ee;
border:1px solid #ffffff22;
border-radius:10px;
font-size:8px;
white-space:nowrap;
max-width:70px;
overflow:hidden;
text-overflow:ellipsis
}
</style>
</head>

<body>

<div id="login">
<div class="card">

<div class="logo">🚗</div>

<h1>همیاب</h1>

<div class="subtitle">
نقشه زنده گروهی<br>
همه اعضای آنلاین را روی یک نقشه ببین
</div>

<input id="name" maxlength="30" placeholder="نام شما">

<button class="join" id="join">
🚀 ورود به نقشه
</button>

</div>
</div>

<div id="map"></div>

<div class="top">

<div class="brand">
🚗 همیاب
</div>

<div id="status" class="status">
<span class="dot"></span>
اتصال...
</div>

</div>

<div class="controls">

<button id="me">📍</button>
<button id="all">👥</button>
<button id="zin">＋</button>
<button id="zout">－</button>

</div>

<div id="panel">

<div class="panelHead">

<span>👥 افراد روی نقشه</span>

<span>
<span id="count" class="count">۰</span>
 نفر
</span>

</div>

<div id="users"></div>

</div>

<div id="toast"></div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

apiKey:"AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",

authDomain:"location-tracker-e732b.firebaseapp.com",

databaseURL:"https://location-tracker-e732b-default-rtdb.firebaseio.com",

projectId:"location-tracker-e732b",

storageBucket:"location-tracker-e732b.firebasestorage.app",

messagingSenderId:"425589009128",

appId:"1:425589009128:web:759e3b6b614434eb75775d"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const locationsRef=db.ref("locations");

const connectedRef=db.ref(".info/connected");


/* =========================
   VARIABLES
========================= */

let map=null;

let myId=null;

let myName="";

let myLat=null;

let myLng=null;

let gpsWatch=null;

let firstGPS=true;

const users={};

const markers={};

const paths={};


/* =========================
   USER ID
========================= */

function getUserId(){

let id=localStorage.getItem("hamyab_uid");

if(!id){

id="u_"+Date.now()+"_"+Math.random()
.toString(36)
.substring(2,10);

localStorage.setItem("hamyab_uid",id);

}

return id;

}


/* =========================
   HELPERS
========================= */

function esc(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const t=document.getElementById("toast");

t.textContent=text;

t.style.display="block";

clearTimeout(t.timer);

t.timer=setTimeout(()=>{

t.style.display="none";

},3000);

}

function color(name){

let h=0;

for(let i=0;i<name.length;i++){

h=name.charCodeAt(i)+((h<<5)-h);

}

return `hsl(${Math.abs(h)%360},75%,52%)`;

}

function online(user){

return user &&
user.timestamp &&
Date.now()-user.timestamp<90000;

}


/* =========================
   MAP
========================= */

function initMap(){

map=L.map("map",{
zoomControl:false,
preferCanvas:true
}).setView([35.6892,51.3890],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

}


/* =========================
   MARKER
========================= */

function icon(user,isMe){

const c=isMe?"#22c55e":color(user.name);

return L.divIcon({

className:"",

iconSize:[65,65],

iconAnchor:[32,32],

popupAnchor:[0,-30],

html:`

<div class="car">

<div class="carIcon ${isMe?"me":""}"
style="border-color:${c}">
🚗
</div>

<div class="carName">
${esc(user.name)}
</div>

</div>

`

});

}


/* =========================
   MARKER UPDATE
========================= */

function updateMarker(id,user){

if(
typeof user.lat!=="number" ||
typeof user.lng!=="number"
)return;

const isMe=id===myId;

if(!markers[id]){

markers[id]=L.marker(
[user.lat,user.lng],
{
icon:icon(user,isMe),
zIndexOffset:isMe?2000:0
}
).addTo(map);

markers[id].bindPopup(`
<strong>${esc(user.name)}</strong>
<br>
${isMe?"🟢 شما":"🟢 آنلاین"}
<br>
دقت GPS:
${user.accuracy?
Math.round(user.accuracy)+" متر":
"نامشخص"}
`);

paths[id]=L.polyline(
[[user.lat,user.lng]],
{
color:isMe?"#22c55e":color(user.name),
weight:3,
opacity:.35
}
).addTo(map);

}else{

markers[id].setLatLng(
[user.lat,user.lng]
);

markers[id].setIcon(
icon(user,isMe)
);

}

}


/* =========================
   REMOVE
========================= */

function removeUser(id){

if(markers[id]){

map.removeLayer(markers[id]);

delete markers[id];

}

if(paths[id]){

map.removeLayer(paths[id]);

delete paths[id];

}

delete users[id];

}


/* =========================
   USER LIST
========================= */

function updateUsers(){

const box=document.getElementById("users");

box.innerHTML="";

const arr=Object.values(users)
.filter(u=>online(u))
.sort((a,b)=>b.timestamp-a.timestamp);

document.getElementById("count")
.textContent=arr.length;

if(!arr.length){

box.innerHTML=
"<span style='color:#94a3b8;font-size:11px'>هنوز کسی آنلاین نیست</span>";

return;

}

arr.forEach(user=>{

const el=document.createElement("div");

el.className="user";

el.innerHTML="🟢 "+esc(user.name);

el.onclick=()=>{

map.setView(
[user.lat,user.lng],
17,
{animate:true}
);

if(markers[user.id]){

markers[user.id].openPopup();

}

};

box.appendChild(el);

});

}


/* =========================
   FIREBASE LISTENER
========================= */

function listenLocations(){

locationsRef.on("value",snapshot=>{

const data=snapshot.val()||{};

const ids=new Set(Object.keys(data));

Object.keys(users).forEach(id=>{

if(!ids.has(id)){

removeUser(id);

}

});

Object.entries(data).forEach(([id,loc])=>{

if(!loc)return;

if(
typeof loc.lat!=="number" ||
typeof loc.lng!=="number"
)return;

users[id]={

id:id,

name:loc.name||"کاربر",

lat:loc.lat,

lng:loc.lng,

accuracy:loc.accuracy||null,

timestamp:Number(loc.timestamp)||0

};

updateMarker(id,users[id]);

});

updateUsers();

});

}


/* =========================
   SEND LOCATION
========================= */

let lastLat=null;

let lastLng=null;

let lastSend=0;

function sendLocation(lat,lng,accuracy){

if(!myId)return;

const now=Date.now();

if(
lastLat!==null &&
lastLng!==null &&
now-lastSend<3000
)return;

lastLat=lat;

lastLng=lng;

lastSend=now;

const ref=locationsRef.child(myId);

ref.set({

id:myId,

name:myName,

lat:lat,

lng:lng,

accuracy:accuracy||null,

timestamp:firebase.database.ServerValue.TIMESTAMP

}).catch(err=>{

console.error(err);

toast("❌ خطا در ارسال موقعیت");

});

}


/* =========================
   GPS
========================= */

function startGPS(){

if(!navigator.geolocation){

toast("❌ GPS در دسترس نیست");

return;

}

const options={

enableHighAccuracy:true,

timeout:20000,

maximumAge:3000

};

navigator.geolocation.getCurrentPosition(

position=>handleGPS(position),

error=>{

console.warn(error);

toast("❌ اجازه یا دسترسی GPS مشکل دارد");

},

options

);

gpsWatch=navigator.geolocation.watchPosition(

position=>handleGPS(position),

error=>console.warn("GPS",error),

options

);

}


/* =========================
   GPS HANDLER
========================= */

function handleGPS(position){

myLat=position.coords.latitude;

myLng=position.coords.longitude;

const accuracy=position.coords.accuracy;

sendLocation(
myLat,
myLng,
accuracy
);

const me={

id:myId,

name:myName,

lat:myLat,

lng:myLng,

accuracy:accuracy,

timestamp:Date.now()

};

users[myId]=me;

updateMarker(myId,me);

updateUsers();

if(firstGPS){

firstGPS=false;

map.setView(
[myLat,myLng],
16,
{animate:true}
);

toast("📍 موقعیت شما پیدا شد");

}

}


/* =========================
   PRESENCE
========================= */

function setupPresence(){

const ref=locationsRef.child(myId);

ref.onDisconnect().remove();

connectedRef.on("value",snap=>{

const connected=snap.val()===true;

const status=document.getElementById("status");

if(connected){

status.classList.remove("offline");

status.innerHTML=
'<span class="dot"></span>آنلاین';

}else{

status.classList.add("offline");

status.innerHTML=
'<span class="dot"></span>قطع اتصال';

}

});

}


/* =========================
   JOIN
========================= */

function join(){

const name=document
.getElementById("name")
.value.trim();

if(name.length<2){

toast("نام حداقل ۲ حرف باشد");

return;

}

myName=name;

myId=getUserId();

document.getElementById("login")
.style.display="none";

initMap();

setupPresence();

listenLocations();

startGPS();

toast("👋 خوش آمدی "+myName);

}


/* =========================
   BUTTONS
========================= */

document.getElementById("join")
.onclick=join;

document.getElementById("name")
.addEventListener("keydown",e=>{

if(e.key==="Enter")join();

});

document.getElementById("me")
.onclick=()=>{

if(myLat!==null){

map.setView(
[myLat,myLng],
17,
{animate:true}
);

}else{

toast("⏳ هنوز GPS پیدا نشده");

}

};

document.getElementById("all")
.onclick=()=>{

const points=Object.values(users)

.filter(u=>online(u))

.map(u=>[u.lat,u.lng]);

if(!points.length){

toast("👥 کاربر آنلاینی نیست");

return;

}

if(points.length===1){

map.setView(points[0],16);

return;

}

map.fitBounds(
L.latLngBounds(points),
{
padding:[80,80],
maxZoom:16
}
);

};

document.getElementById("zin")
.onclick=()=>map.zoomIn();

document.getElementById("zout")
.onclick=()=>map.zoomOut();


/* =========================
   CLEANUP
========================= */

window.addEventListener(
"beforeunload",
()=>{

if(gpsWatch!==null){

navigator.geolocation
.clearWatch(gpsWatch);

}

if(myId){

locationsRef
.child(myId)
.remove();

}

}
);


/* =========================
   REFRESH ONLINE STATUS
========================= */

setInterval(()=>{

updateUsers();

},10000);

</script>

</body>
</html>
