<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیاب - مثل اسنپ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0b1220;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 24px;
        }
        .loginCard {
            background: #1e293b;
            border-radius: 32px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
            border: 1px solid #334155;
            text-align: center;
        }
        .loginCard h1 {
            color: #f5c542;
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .loginCard p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .loginCard input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 16px;
            text-align: center;
        }
        .loginCard input:focus {
            border-color: #f5c542;
            outline: none;
        }
        .loginCard button {
            width: 100%;
            padding: 16px;
            background: #f5c542;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .controls {
            position: fixed;
            right: 12px;
            bottom: 120px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls button {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #usersPanel {
            position: fixed;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        #usersList {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .user-chip {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #334155;
            cursor: pointer;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f5c542;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 999;
            display: none;
            border: 1px solid #f5c542;
        }
        .car-marker {
            background: transparent !important;
            border: 0 !important;
        }
        .car-wrap {
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .car-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 3px solid #2563eb;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }
        .car-circle.me {
            border-color: #22c55e;
        }
        .car-circle.friend {
            border-color: #f5c542;
        }
        .car-name {
            margin-top: 2px;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 8px;
            white-space: nowrap;
        }
        .status-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #22c55e;
            margin-left: 3px;
        }
        .share-box {
            margin-top: 12px;
            padding: 10px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .share-box input {
            width: 70%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 0.7rem;
            text-align: center;
        }
        .share-box button {
            padding: 6px 12px;
            background: #f5c542;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .role-selector {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }
        .role-selector button {
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            cursor: pointer;
        }
        .role-selector button.active {
            background: #f5c542;
            color: #000;
            border-color: #f5c542;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="loginCard">
            <h1>🚗 همیاب</h1>
            <p>مثل اسنپ! موقعیت خود را با دوستان به اشتراک بگذار</p>
            <input id="nameInput" maxlength="20" placeholder="نام شما..." autofocus>
            <div class="role-selector">
                <button id="driverBtn" class="active">🚗 راننده</button>
                <button id="passengerBtn">👤 مسافر</button>
            </div>
            <button id="joinBtn">🚀 ورود به نقشه</button>
            <div class="share-box">
                <p style="font-size:0.7rem;color:#94a3b8;margin-bottom:6px;">🔗 لینک اشتراک‌گذاری</p>
                <input id="shareLink" value="https://zaro090.github.io/hamyab/" readonly>
                <button onclick="copyLink()">📋 کپی</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <button id="myLocationBtn">📍</button>
        <button id="zoomInBtn">＋</button>
        <button id="zoomOutBtn">－</button>
    </div>

    <div id="usersPanel">
        <span>👥 کاربران آنلاین:</span>
        <span id="onlineCount">۰ نفر</span>
        <div id="usersList"></div>
    </div>

    <div id="toast"></div>

    <script>
        // ===== تنظیمات =====
        let map, myMarker, myName, myLat, myLng;
        const userMarkers = {};
        let watchId = null;
        let role = 'driver'; // driver or passenger
        let friendLocation = null;
        let friendName = null;

        // ===== نقشه =====
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        // ===== پیام =====
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 3000);
        }

        // ===== کپی لینک =====
        function copyLink() {
            const input = document.getElementById('shareLink');
            input.select();
            document.execCommand('copy');
            toast('✅ لینک کپی شد!');
        }

        // ===== آیکون ماشین =====
        function carIcon(name, isMe, isFriend = false) {
            const color = isMe ? '#22c55e' : (isFriend ? '#f5c542' : '#2563eb');
            return L.divIcon({
                className: 'car-marker',
                iconSize: [70, 70],
                iconAnchor: [35, 35],
                popupAnchor: [0, -35],
                html: `
                    <div class="car-wrap">
                        <div class="car-circle ${isMe ? 'me' : (isFriend ? 'friend' : '')}" style="border-color:${color}">🚗</div>
                        <div class="car-name"><span class="status-dot"></span> ${name}</div>
                    </div>
                `
            });
        }

        // ===== به‌روزرسانی مارکر دوست =====
        function updateFriendMarker() {
            if (friendLocation && friendName) {
                const key = 'friend_' + friendName;
                if (!userMarkers[key]) {
                    const icon = carIcon(friendName, false, true);
                    const marker = L.marker([friendLocation.lat, friendLocation.lng], { icon }).addTo(map);
                    marker.bindPopup(`<b>${friendName}</b> (دوست)`);
                    userMarkers[key] = marker;
                } else {
                    userMarkers[key].setLatLng([friendLocation.lat, friendLocation.lng]);
                }
                // لیست کاربران
                updateUI();
            }
        }

        // ===== آپدیت مارکر خودم =====
        function updateMyMarker() {
            if (myName && myLat && myLng) {
                const key = 'me_' + myName;
                if (!userMarkers[key]) {
                    const icon = carIcon(myName, true);
                    const marker = L.marker([myLat, myLng], { icon, zIndexOffset: 2000 }).addTo(map);
                    marker.bindPopup(`<b>${myName}</b> (شما)`);
                    userMarkers[key] = marker;
                } else {
                    userMarkers[key].setLatLng([myLat, myLng]);
                }
                updateUI();
            }
        }

        // ===== آپدیت لیست کاربران =====
        function updateUI() {
            const list = document.getElementById('usersList');
            const count = document.getElementById('onlineCount');
            const users = [];
            if (myName) users.push(myName);
            if (friendName) users.push(friendName + ' ⭐');
            count.textContent = users.length + ' نفر';
            list.innerHTML = users.map(u =>
                `<span class="user-chip">🚗 ${u}</span>`
            ).join('');
        }

        // ===== GPS =====
        function startGPS() {
            if (!navigator.geolocation) {
                toast('❌ GPS در دسترس نیست');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    updateMyMarker();
                    map.setView([myLat, myLng], 16, { animate: true });
                    toast('✅ موقعیت شما ثبت شد');
                    // اگر راننده هستی، لینک رو به‌روز کن
                    if (role === 'driver') {
                        updateShareLink();
                    }
                },
                err => toast('❌ خطا: ' + err.message),
                { enableHighAccuracy: true, timeout: 15000 }
            );
            watchId = navigator.geolocation.watchPosition(
                pos => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    updateMyMarker();
                    if (role === 'driver') {
                        updateShareLink();
                    }
                },
                err => console.log('GPS:', err),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ===== به‌روزرسانی لینک اشتراک‌گذاری =====
        function updateShareLink() {
            if (myLat && myLng && myName) {
                const link = `https://zaro090.github.io/hamyab/?lat=${myLat}&lng=${myLng}&name=${encodeURIComponent(myName)}`;
                document.getElementById('shareLink').value = link;
            }
        }

        // ===== دریافت موقعیت از لینک =====
        function getLocationFromURL() {
            const params = new URLSearchParams(window.location.search);
            const lat = parseFloat(params.get('lat'));
            const lng = parseFloat(params.get('lng'));
            const name = params.get('name');
            if (lat && lng && name) {
                friendLocation = { lat, lng };
                friendName = name;
                toast(`📍 موقعیت ${name} دریافت شد`);
                return true;
            }
            return false;
        }

        // ===== ورود =====
        function joinApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { toast('❌ نام خود را وارد کن'); return; }
            if (name.length < 2) { toast('❌ نام حداقل ۲ حرف باشد'); return; }
            myName = name;
            document.getElementById('loginOverlay').style.display = 'none';
            initMap();

            // چک کردن لینک برای موقعیت دوست
            const hasFriend = getLocationFromURL();

            startGPS();

            // اگه دوست توی لینک بود، مارکرش رو نشون بده
            if (hasFriend) {
                setTimeout(() => {
                    updateFriendMarker();
                    if (friendLocation) {
                        map.setView([friendLocation.lat, friendLocation.lng], 14);
                        toast(`📍 موقعیت ${friendName} روی نقشه`);
                    }
                }, 1000);
            }

            // اگه راننده هستی، لینک رو به‌روز کن
            if (role === 'driver') {
                setTimeout(updateShareLink, 2000);
            }

            // حذف کاربر هنگام خروج
            window.addEventListener('beforeunload', () => {
                if (watchId) navigator.geolocation.clearWatch(watchId);
            });
        }

        // ===== انتخاب نقش =====
        document.getElementById('driverBtn').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('passengerBtn').classList.remove('active');
            role = 'driver';
            document.querySelector('.share-box').style.display = 'block';
            toast('🚗 حالت راننده فعال شد');
        });

        document.getElementById('passengerBtn').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('driverBtn').classList.remove('active');
            role = 'passenger';
            document.querySelector('.share-box').style.display = 'none';
            toast('👤 حالت مسافر فعال شد');
        });

        // ===== رویدادها =====
        document.getElementById('joinBtn').addEventListener('click', joinApp);
        document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinApp(); });
        document.getElementById('myLocationBtn').addEventListener('click', () => {
            if (myLat && myLng) {
                map.setView([myLat, myLng], 17, { animate: true });
                toast('📍 رفتن به موقعیت شما');
            }
        });
        document.getElementById('zoomInBtn').addEventListener('click', () => map.zoomIn());
        document.getElementById('zoomOutBtn').addEventListener('click', () => map.zoomOut());

        // مخفی کردن باکس اشتراک برای مسافر
        document.querySelector('.share-box').style.display = 'block';

        console.log('🚗 همیاب مثل اسنپ آماده است!');
        console.log('📌 راننده لینک رو به مسافر بده تا موقعیتت رو ببینه');
    </script>
</body>
</html>
