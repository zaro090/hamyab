<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
apiKey:"AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",
authDomain:"location-tracker-e732b.firebaseapp.com",
projectId:"location-tracker-e732b",
storageBucket:"location-tracker-e732b.firebasestorage.app",
messagingSenderId:"425589009128",
appId:"1:425589009128:web:759e3b6b614434eb75775d"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


/* =========================
   STATE
========================= */

let map=null;

let myUserId=null;
let myName="";

let myLat=null;
let myLng=null;
let myAccuracy=null;

let watchId=null;
let firstGPS=true;

const locationCache={};
const userMarkers={};

let toastTimer=null;


/* =========================
   USER ID
========================= */

function createUserId(){

const old=localStorage.getItem("hamyab_user_id");

if(old) return old;

const id=
"u_"+
Date.now().toString(36)+
"_"+
Math.random().toString(36).substring(2,12);

localStorage.setItem("hamyab_user_id",id);

return id;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   TOAST
========================= */

function toast(message){

const el=document.getElementById("toast");

el.textContent=message;
el.style.display="block";

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{
el.style.display="none";
},2800);

}


/* =========================
   MAP
========================= */

function initializeMap(){

map=L.map("map",{
zoomControl:false,
preferCanvas:true
}).setView([35.6892,51.3890],5);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

}


/* =========================
   COLOR
========================= */

function userColor(name){

let hash=0;

for(let i=0;i<name.length;i++){

hash=
name.charCodeAt(i)+
((hash<<5)-hash);

}

return `hsl(${Math.abs(hash)%360},75%,52%)`;

}


/* =========================
   DISTANCE
========================= */

function distance(
lat1,
lng1,
lat2,
lng2
){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLng=(lng2-lng1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}


function distanceText(m){

if(m<1000)
return Math.round(m)+" متر";

return (m/1000).toFixed(1)+" کیلومتر";

}


/* =========================
   ONLINE
========================= */

function isOnline(user){

if(!user || !user.timestamp)
return false;

return Date.now()-user.timestamp<120000;

}


/* =========================
   ICON
========================= */

function createCarIcon(user,isMe){

const color=
isMe?
"#22c55e":
userColor(user.name||"کاربر");

const opacity=
isOnline(user)?
1:
0.45;

return L.divIcon({

className:"carMarker",

iconSize:[70,70],

iconAnchor:[35,35],

popupAnchor:[0,-35],

html:`

<div class="carWrap">

<div
class="carCircle ${isMe?"me":""}"
style="
border-color:${color};
opacity:${opacity};
">
🚗
</div>

<div class="carName">
${escapeHTML(user.name||"کاربر")}
</div>

</div>

`

});

}


/* =========================
   POPUP
========================= */

function popupHTML(user){

let dist="";

if(
myLat!==null &&
myLng!==null &&
user.lat!==undefined &&
user.lng!==undefined &&
user.id!==myUserId
){

dist=
`<br>📏 فاصله: ${
distanceText(
distance(
myLat,
myLng,
user.lat,
user.lng
)
)
}`;

}

let time="نامشخص";

if(user.timestamp){

time=
new Date(user.timestamp)
.toLocaleTimeString(
"fa-IR",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

return `

<strong>
${escapeHTML(user.name||"کاربر")}
</strong>

${user.id===myUserId?
"<br>🟢 این شما هستید":
""}

<br>
${isOnline(user)?
"🟢 آنلاین":
"⚪ آخرین موقعیت"}

${dist}

${
user.accuracy?
`<br>🎯 دقت GPS: ${Math.round(user.accuracy)} متر`
:""
}

<br>
🕐 ${time}

`;

}


/* =========================
   UPDATE MARKER
========================= */

function updateMarker(userId,user){

if(
!user ||
typeof user.lat!=="number" ||
typeof user.lng!=="number"
)return;

const isMe=userId===myUserId;

const icon=createCarIcon(user,isMe);

if(!userMarkers[userId]){

const marker=
L.marker(
[user.lat,user.lng],
{
icon,
zIndexOffset:isMe?2000:0
}
).addTo(map);

marker.bindPopup(
popupHTML(user)
);

userMarkers[userId]=marker;

}else{

const marker=userMarkers[userId];

marker.setLatLng(
[user.lat,user.lng]
);

marker.setIcon(icon);

marker.setPopupContent(
popupHTML(user)
);

}

}


/* =========================
   REMOVE MARKER
========================= */

function removeMarker(userId){

if(userMarkers[userId]){

map.removeLayer(
userMarkers[userId]
);

delete userMarkers[userId];

}

}


/* =========================
   USER LIST
========================= */

function updateUserList(){

const list=
document.getElementById("usersList");

const count=
document.getElementById("onlineCount");

list.innerHTML="";

const users=
Object.values(locationCache);

const onlineUsers=
users.filter(isOnline);

count.textContent=
onlineUsers.length+" نفر";

users.sort(
(a,b)=>
Number(isOnline(b))-
Number(isOnline(a))
);

users.forEach(user=>{

const chip=
document.createElement("div");

chip.className="userChip";

chip.innerHTML=`

<span class="smallDot"></span>
${escapeHTML(user.name||"کاربر")}

`;

chip.onclick=()=>{

if(
typeof user.lat==="number" &&
typeof user.lng==="number"
){

map.setView(
[user.lat,user.lng],
17,
{animate:true}
);

if(userMarkers[user.id])
userMarkers[user.id].openPopup();

}

};

list.appendChild(chip);

});

if(!users.length){

list.innerHTML=
`<div style="color:#9ca3af;font-size:10px;padding:4px">
هنوز کاربری روی نقشه نیست
</div>`;

}

}


/* =========================
   IMPORTANT:
   REAL FIREBASE LISTENER
========================= */

function listenLocations(){

const ref=db.ref("locations");

/*
  این listener روی کل locations است.
  بنابراین هر کاربری که از هر گوشی وارد شود،
  داده‌اش داخل locationCache قرار می‌گیرد.
*/

ref.on(
"value",
snapshot=>{

const data=
snapshot.val()||{};

/* حذف کاربران حذف‌شده از Firebase */

Object.keys(locationCache)
.forEach(userId=>{

if(!data[userId]){

delete locationCache[userId];

removeMarker(userId);

}

});


/* ذخیره تمام کاربران دیگر */

Object.keys(data)
.forEach(userId=>{

const loc=data[userId];

if(
!loc ||
typeof loc.lat!=="number" ||
typeof loc.lng!=="number"
)return;


/*
  مشکل اصلی نسخه قبلی اینجا بود:
  داده Firebase باید حتماً وارد cache شود.
*/

locationCache[userId]={

id:userId,

name:
loc.name||
"کاربر",

lat:
loc.lat,

lng:
loc.lng,

accuracy:
typeof loc.accuracy==="number"?
loc.accuracy:
null,

timestamp:
typeof loc.timestamp==="number"?
loc.timestamp:
0

};


/* ساخت یا آپدیت مارکر */

updateMarker(
userId,
locationCache[userId]
);

});


updateUserList();

},
error=>{

console.error(error);

toast(
"❌ خطا در دریافت اطلاعات Firebase"
);

}

);

}


/* =========================
   SEND LOCATION
========================= */

let lastSentTime=0;
let lastSentLat=null;
let lastSentLng=null;

function sendLocation(
lat,
lng,
accuracy
){

if(!myUserId || !myName)
return;

const now=Date.now();

let moved=Infinity;

if(
lastSentLat!==null &&
lastSentLng!==null
){

moved=
distance(
lastSentLat,
lastSentLng,
lat,
lng
);

}

/*
  حداقل هر 5 ثانیه،
  یا وقتی بیش از 5 متر حرکت کرد.
*/

if(
now-lastSentTime<5000 &&
moved<5
)return;

lastSentTime=now;

lastSentLat=lat;
lastSentLng=lng;

db.ref(
"locations/"+myUserId
).set({

id:myUserId,

name:myName,

lat:lat,

lng:lng,

accuracy:
accuracy||null,

timestamp:
firebase.database.ServerValue.TIMESTAMP

}).catch(error=>{

console.error(
"sendLocation:",
error
);

});

}


/* =========================
   GPS
========================= */

function startGPS(){

if(!navigator.geolocation){

toast(
"❌ GPS در این مرورگر در دسترس نیست"
);

return;

}

const options={

enableHighAccuracy:true,

timeout:20000,

maximumAge:2000

};


navigator.geolocation.getCurrentPosition(

handlePosition,

handleGPSError,

options

);


watchId=
navigator.geolocation.watchPosition(

handlePosition,

handleGPSError,

options

);

}


/* =========================
   POSITION
========================= */

function handlePosition(pos){

myLat=
pos.coords.latitude;

myLng=
pos.coords.longitude;

myAccuracy=
pos.coords.accuracy;


/* وضعیت GPS */

document.getElementById(
"gpsStatus"
).style.display="block";

document.getElementById(
"accuracy"
).textContent=
Math.round(myAccuracy);


/* ارسال Firebase */

sendLocation(
myLat,
myLng,
myAccuracy
);


/*
  cache محلی فقط برای کاربر خودمان.
  کاربران دیگر از Firebase listener می‌آیند.
*/

locationCache[myUserId]={

id:myUserId,

name:myName,

lat:myLat,

lng:myLng,

accuracy:myAccuracy,

timestamp:Date.now()

};


updateMarker(
myUserId,
locationCache[myUserId]
);

updateUserList();


/* اولین موقعیت */

if(firstGPS){

firstGPS=false;

map.setView(
[myLat,myLng],
16,
{animate:true}
);

toast(
"✅ موقعیت شما ثبت شد"
);

}

}


/* =========================
   GPS ERROR
========================= */

function handleGPSError(error){

console.warn(
"GPS:",
error
);

if(error.code===1){

toast(
"❌ اجازه موقعیت مکانی داده نشده است"
);

}else if(error.code===2){

toast(
"⚠️ موقعیت GPS در دسترس نیست"
);

}else if(error.code===3){

toast(
"⚠️ دریافت موقعیت طول کشید"
);

}

}


/* =========================
   CONNECTION
========================= */

function setupConnection(){

const el=
document.getElementById(
"connection"
);

db.ref(".info/connected")
.on(
"value",
snap=>{

if(snap.val()===true){

el.classList.remove(
"offline"
);

el.innerHTML=
`<span class="dot"></span>آنلاین`;

}else{

el.classList.add(
"offline"
);

el.innerHTML=
`<span class="dot"></span>قطع اتصال`;

}

}

);

}


/* =========================
   PRESENCE
========================= */

function setupPresence(){

const userRef=
db.ref(
"locations/"+myUserId
);

/*
  اگر مرورگر/گوشی قطع شد،
  رکورد کاربر از Firebase حذف می‌شود.
*/

userRef
.onDisconnect()
.remove()
.catch(console.error);


/*
  وقتی دوباره Firebase وصل شد،
  رکورد کاربر ساخته می‌شود.
*/

db.ref(".info/connected")
.on(
"value",
snap=>{

if(snap.val()!==true)
return;

userRef.set({

id:myUserId,

name:myName,

lat:
myLat!==null?
myLat:
0,

lng:
myLng!==null?
myLng:
0,

accuracy:
myAccuracy||null,

timestamp:
firebase.database.ServerValue.TIMESTAMP

}).catch(console.error);

}

);

}


/* =========================
   MY LOCATION
========================= */

function goToMyLocation(){

if(
myLat===null ||
myLng===null
){

toast(
"⏳ هنوز GPS موقعیت شما را پیدا نکرده"
);

return;

}

map.setView(
[myLat,myLng],
17,
{animate:true}
);

if(userMarkers[myUserId])
userMarkers[myUserId].openPopup();

}


/* =========================
   SHOW ALL
========================= */

function showAll(){

const points=[];

Object.values(locationCache)
.forEach(user=>{

if(
typeof user.lat==="number" &&
typeof user.lng==="number" &&
isOnline(user)
){

points.push([
user.lat,
user.lng
]);

}

});

if(!points.length){

toast(
"👥 کاربر آنلاین پیدا نشد"
);

return;

}

if(points.length===1){

map.setView(
points[0],
16,
{animate:true}
);

return;

}

map.fitBounds(
L.latLngBounds(points),
{
padding:[80,80],
maxZoom:16,
animate:true
}
);

}


/* =========================
   JOIN
========================= */

function joinApp(){

const input=
document.getElementById(
"nameInput"
);

const name=
input.value.trim();

if(!name){

toast(
"لطفاً نام خود را وارد کن"
);

input.focus();

return;

}

if(name.length<2){

toast(
"نام حداقل ۲ حرف باشد"
);

return;

}

myName=name;

myUserId=
createUserId();


document.getElementById(
"loginOverlay"
).style.display="none";


initializeMap();

setupConnection();

setupPresence();

listenLocations();

startGPS();


toast(
"👋 خوش آمدی "+myName
);

}


/* =========================
   BUTTONS
========================= */

document.getElementById(
"joinBtn"
).addEventListener(
"click",
joinApp
);


document.getElementById(
"nameInput"
).addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
joinApp();

}
);


document.getElementById(
"myLocationBtn"
).addEventListener(
"click",
goToMyLocation
);


document.getElementById(
"showAllBtn"
).addEventListener(
"click",
showAll
);


document.getElementById(
"zoomInBtn"
).addEventListener(
"click",
()=>map.zoomIn()
);


document.getElementById(
"zoomOutBtn"
).addEventListener(
"click",
()=>map.zoomOut()
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
"beforeunload",
()=>{

if(
watchId!==null &&
navigator.geolocation
){

navigator.geolocation.clearWatch(
watchId
);

}

}
);


/*
  هر 15 ثانیه لیست آنلاین را تازه می‌کنیم
  تا وضعیت کاربران قدیمی به‌روز شود.
*/

setInterval(
()=>{

Object.keys(locationCache)
.forEach(id=>{

if(
locationCache[id] &&
locationCache[id].timestamp &&
Date.now()-
locationCache[id].timestamp>120000
){

updateMarker(
id,
locationCache[id]
);

}

});

updateUserList();

},
15000
);

console.log(
"🚗 همیاب | Firebase Live Map Ready"
);

</script>
