<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیباگ همیاب</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #111827; color: #fff; padding: 20px; }
        .card { background: #1f2937; padding: 16px; border-radius: 12px; margin: 10px 0; border: 1px solid #374151; }
        .online { color: #22c55e; }
        .offline { color: #6b7280; }
        button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        pre { background: #0f172a; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 11px; }
    </style>
</head>
<body>
    <h1>🔍 دیباگ همیاب</h1>
    <p>لیست کاربران آنلاین در Firebase</p>
    <button onclick="loadData()">🔄 بارگذاری مجدد</button>
    <div id="result"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",
            authDomain: "location-tracker-e732b.firebaseapp.com",
            projectId: "location-tracker-e732b",
            storageBucket: "location-tracker-e732b.firebasestorage.app",
            messagingSenderId: "425589009128",
            appId: "1:425589009128:web:759e3b6b614434eb75775d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadData() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ در حال بارگذاری...';

            db.ref('locations').on('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    result.innerHTML = '<div class="card">❌ هیچ کاربری آنلاین نیست</div>';
                    return;
                }

                const now = Date.now();
                let html = '<div class="card">✅ کاربران آنلاین:</div>';
                let count = 0;

                for (let id in data) {
                    const loc = data[id];
                    if (!loc.lat || !loc.lng) continue;

                    const timeDiff = (now - loc.timestamp) / 1000 / 60;
                    const isOnline = timeDiff < 2;

                    if (isOnline) {
                        count++;
                        html += `<div class="card">
                            <strong>👤 ${loc.name || 'کاربر'}</strong><br>
                            📍 ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}<br>
                            🕐 ${Math.round(timeDiff)} دقیقه پیش<br>
                            <span class="online">🟢 آنلاین</span>
                        </div>`;
                    }
                }

                if (count === 0) {
                    html += '<div class="card">❌ هیچ کاربری آنلاین نیست</div>';
                } else {
                    html += `<div class="card">✅ مجموع: ${count} کاربر آنلاین</div>`;
                }

                result.innerHTML = html;
            });
        }

        loadData();
    </script>
</body>
</html>
